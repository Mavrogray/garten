  // Rundgang
  function draftFrom(rid, n) {
    var v = getV(rid, 'g' + n) || {};
    var d = { wOk: !!v.wOk, sOk: !!v.sOk };
    ['w', 's'].forEach(function (k) {
      d[k] = numDraft(v[k]);
      d[k + 'T'] = !!v[k + 'T'];
      d[k + 'Alt'] = v[k + 'T'] ? numDraft(v[k + 'T'].alt) : '';
      d[k + 'Neu'] = v[k + 'T'] ? numDraft(v[k + 'T'].neu) : '';
      d[k + 'R'] = v[k + 'R'] ? v[k + 'R'].code : '';
      d[k + 'Rt'] = v[k + 'R'] ? v[k + 'R'].text : '';
    });
    return d;
  }
  function rgGo(rid, n) {
    var gs = meterGardens(), idx;
    if (n != null) idx = gs.indexOf(n);
    else { idx = -1; for (var i = 0; i < gs.length; i++) if (!gardenDone(rid, gs[i])) { idx = i; break; } }
    if (idx < 0) idx = 0;
    ui.rg = { rid: rid, idx: idx, draft: draftFrom(rid, gs[idx]), issues: {} };
    ui.sview = 'mround';
  }
  function rgMove(idx) {
    var gs = meterGardens();
    idx = Math.max(0, Math.min(gs.length - 1, idx));
    ui.rg.idx = idx; ui.rg.draft = draftFrom(ui.rg.rid, gs[idx]); ui.rg.issues = {};
  }
  function draftTausch(k) {
    var d = ui.rg.draft;
    return d[k + 'T'] ? { alt: parseNum(d[k + 'Alt']), neu: parseNum(d[k + 'Neu']) } : null;
  }
  function draftCons(k) {
    var n = meterGardens()[ui.rg.idx], cur = parseNum(ui.rg.draft[k]);
    return consCalc(cur, prevOf(ui.rg.rid, 'g' + n, k), draftTausch(k));
  }
  function consText(k) {
    var n = meterGardens()[ui.rg.idx], p = prevOf(ui.rg.rid, 'g' + n, k), c = draftCons(k);
    if (!p) return 'Startwert, Verbrauch ab der nächsten Ablesung';
    if (c == null) return '';
    return 'Verbrauch: <b style="color:' + (c < 0 ? 'var(--red-ink)' : 'var(--accent-dark)') + '">' + fmtSigned(c) + ' ' + MT[k].unit + '</b>';
  }
  function typeBlock(k, n) {
    var d = ui.rg.draft, rid = ui.rg.rid, p = prevOf(rid, 'g' + n, k), iss = ui.rg.issues[k];
    var h = '<div class="card"><div class="between"><div class="h2">' + MT[k].name + '</div><span class="chip">' + MT[k].unit + '</span></div>' +
      '<div class="small">' + (p ? 'Letzte Ablesung (' + esc(p.r.name) + '): <b>' + fmtN(p.val) + '</b>' : 'Erste Ablesung, der Wert ist der Startwert.') + '</div>' +
      '<input class="field big-in" type="text" inputmode="decimal" autocomplete="off" data-dr="' + k + '" value="' + esc(d[k]) + '" placeholder="Zählerstand" aria-label="' + MT[k].name + ' Zählerstand Garten ' + n + '">' +
      '<label class="chk"><input type="checkbox" data-dr="' + k + 'T"' + (d[k + 'T'] ? ' checked' : '') + '> Zähler getauscht</label>';
    if (d[k + 'T']) {
      h += '<div class="two"><div><div class="mini-lbl">Endstand alter Zähler</div><input class="field sm" inputmode="decimal" data-dr="' + k + 'Alt" value="' + esc(d[k + 'Alt']) + '" aria-label="Endstand alter Zähler"></div>' +
        '<div><div class="mini-lbl">Startstand neuer Zähler</div><input class="field sm" inputmode="decimal" data-dr="' + k + 'Neu" value="' + esc(d[k + 'Neu']) + '" aria-label="Startstand neuer Zähler"></div></div>' +
        '<div class="small">Oben den aktuellen Stand des neuen Zählers eintragen.</div>';
    }
    h += '<div class="cons" id="cons-' + k + '">' + consText(k) + '</div>';
    if (iss === 'nan') h += '<div class="warn red">Bitte eine gültige Zahl eintragen.</div>';
    if (iss === 'tausch') h += '<div class="warn red">Bitte Endstand des alten und Startstand des neuen Zählers eintragen.</div>';
    if (iss === 'neg' || d[k + 'R']) {
      h += '<div class="warn red"><b>Minusverbrauch.</b> Bitte Grund angeben:' +
        REASONS_FOR[k].map(function (code) {
          return '<label class="chk" style="color:inherit"><input type="radio" name="r-' + k + '" data-dr="' + k + 'R" value="' + code + '"' + (d[k + 'R'] === code ? ' checked' : '') + '> ' + REASONS[code] + '</label>';
        }).join('') +
        '<input class="field sm" data-dr="' + k + 'Rt" value="' + esc(d[k + 'Rt']) + '" placeholder="Erläuterung' + (k === 'w' ? ' (Pflicht)' : ' (bei „Anderer Grund“ Pflicht)') + '" aria-label="Erläuterung"></div>';
    }
    if (iss === 'high' || d[k + 'Ok']) {
      var info = highInfo(rid, n, k, draftCons(k));
      h += '<div class="warn"><b>Ungewöhnlich hoch.</b>' + (info ? '<span>Der Verbrauch ist ' + info + '.</span>' : '') +
        '<label class="chk" style="color:inherit"><input type="checkbox" data-dr="' + k + 'Ok"' + (d[k + 'Ok'] ? ' checked' : '') + '> Wert geprüft, stimmt</label></div>';
    }
    return h + '</div>';
  }
  function viewRound() {
    var rg = ui.rg, r = readingById(rg.rid), gs = meterGardens(), n = gs[rg.idx];
    var done = gs.filter(function (x) { return gardenDone(rg.rid, x); }).length;
    return '<section><button class="back" data-act="rg-exit">‹ ' + esc(r ? r.name : 'Ablesung') + '</button>' +
      '<div class="card green"><div class="between"><div class="big" style="font-size:34px">Garten ' + n + '</div>' +
        (gardenDone(rg.rid, n) ? '<span class="chip white">erfasst</span>' : '') + '</div>' +
        '<div class="small" style="color:var(--accent-dark)">Zähler-Nr. ' + n + ' · ' + done + ' von ' + gs.length + ' erfasst · noch ' + (gs.length - done) + ' offen</div>' +
        '<div class="row"><button class="btn white" data-act="rg-prev"' + (rg.idx === 0 ? ' disabled' : '') + '>‹ Zurück</button>' +
        '<button class="btn white" data-act="rg-skip">Überspringen ›</button></div>' +
        '<div class="row"><input class="field sm" id="rg-jump" type="number" inputmode="numeric" placeholder="Springe zu Garten" aria-label="Springe zu Garten" style="flex:1 1 120px">' +
        '<button class="btn white" data-act="rg-jump" style="flex:0 0 auto">Los</button></div></div>' +
      typeBlock('w', n) + typeBlock('s', n) +
      '<button class="btn primary" data-act="rg-save">Speichern &amp; weiter</button>' +
      '<button class="link" data-act="rg-exit">Rundgang beenden</button>' +
    '</section>';
  }
  function rgSave() {
    var rg = ui.rg, d = rg.draft, gs = meterGardens(), n = gs[rg.idx], rid = rg.rid, issues = {}, rec = {};
    ['w', 's'].forEach(function (k) {
      var cur = parseNum(d[k]);
      if (cur === null) return;
      if (isNaN(cur)) { issues[k] = 'nan'; return; }
      rec[k] = cur;
      if (d[k + 'T']) {
        var t = draftTausch(k);
        if (t.alt == null || t.neu == null || isNaN(t.alt) || isNaN(t.neu)) { issues[k] = 'tausch'; return; }
        rec[k + 'T'] = t;
      }
      var c = consCalc(cur, prevOf(rid, 'g' + n, k), rec[k + 'T']);
      if (c != null && c < 0) {
        var code = d[k + 'R'], txt = String(d[k + 'Rt'] || '').trim();
        if (!code || ((code === 'other' || k === 'w') && !txt)) { issues[k] = 'neg'; return; }
        rec[k + 'R'] = { code: code, text: txt };
      }
      if (highInfo(rid, n, k, c)) {
        if (!d[k + 'Ok']) { issues[k] = 'high'; return; }
        rec[k + 'Ok'] = true;
      }
    });
    if (Object.keys(issues).length) { rg.issues = issues; render(); toast('Bitte die Hinweise prüfen.'); return; }
    var vals = M().vals[rid] = M().vals[rid] || {};
    if (Object.keys(rec).length) vals['g' + n] = rec; else delete vals['g' + n];
    save();
    if (rg.idx < gs.length - 1) { rgMove(rg.idx + 1); render(); document.getElementById('main').scrollTop = 0; toast('Garten ' + n + ' gespeichert.'); }
    else { ui.sview = 'mread'; ui.rg = null; render(); toast('Rundgang am Ende angekommen.'); }
  }

  function viewExc() {
    var list = S.excuses.slice().sort(function (a, b) { return b.ts - a.ts; }).map(function (x) {
      var t = gaById(x.terminId);
      return '<div class="card"><div class="between"><span class="h3">Garten ' + esc(x.garden) + '</span><span class="small">' + clock(x.ts) + '</span></div>' +
        '<div class="small" style="font-weight:700">Termin: ' + (t ? dShort(t.date) : 'gelöscht') + '</div>' +
        '<div class="body">' + esc(x.text) + '</div></div>';
    }).join('') || '<div class="card"><div class="body">Keine Entschuldigungen eingegangen.</div></div>';
    return '<section>' + backBtn() + '<div class="h2">Entschuldigungen</div>' + list + '</section>';
  }

  var TITLES = { start: 'Moin!', boerse: 'Tauschbörse', termine: 'Termine', licht: 'Wegelicht', wetter: 'Temperaturen', settings: 'Einstellungen' };
  var SUBTITLES = { plan: 'Planung', att: 'Anwesenheit', exc: 'Entschuldigungen', year: 'Jahresübersicht', meter: 'Zähler', mread: 'Ablesung', mround: 'Rundgang' };

  function render() {
    var main = document.getElementById('main');
    var nav = document.getElementById('nav');
    var gear = document.getElementById('gear');
    if (!S.garden) {
      document.getElementById('title').textContent = 'Willkommen';
      nav.classList.add('hidden');
      gear.classList.add('hidden');
      main.innerHTML = viewWelcome();
      return;
    }
    nav.classList.remove('hidden');
    gear.classList.remove('hidden');
    var title = TITLES[ui.tab];
    if (ui.tab === 'settings' && ui.admin && SUBTITLES[ui.sview]) title = SUBTITLES[ui.sview];
    document.getElementById('title').textContent = title;
    var views = { start: viewStart, boerse: viewBoerse, termine: viewTermine, licht: viewLicht, wetter: viewWetter, settings: viewSettings };
    main.innerHTML = views[ui.tab]();
    gear.classList.toggle('on', ui.tab === 'settings');
    var chipOn = main.querySelector('.chips button.on');
    if (chipOn) { var box = chipOn.parentNode; box.scrollLeft = chipOn.offsetLeft - box.offsetLeft - box.clientWidth / 2 + chipOn.offsetWidth / 2; }
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function (b) {
      var on = b.dataset.tab === ui.tab;
      b.classList.toggle('on', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }
  // Neuaufbau verzögert, damit er nicht mitten in ein blur/change-Ereignis fällt
  var rrTimer = null;
  function rerenderKeepScroll() {
    if (rrTimer) return;
    rrTimer = setTimeout(function () {
      rrTimer = null;
      var m = document.getElementById('main'); var y = m.scrollTop; render(); m.scrollTop = y;
    }, 0);
  }

  // ---------- Aktionen ----------
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b || b.tagName === 'INPUT') return;
    var act = b.dataset.act, t;
    switch (act) {
      case 'tab':
        ui.tab = b.dataset.tab;
        if (ui.tab !== 'settings') ui.sview = '';
        render(); document.getElementById('main').scrollTop = 0; break;
      case 'welcome': {
        var n = parseInt(document.getElementById('w-garden').value.trim(), 10);
        if (!n || n < 1 || n > 200) { toast('Bitte eine gültige Gartennummer eingeben.'); return; }
        S.garden = String(n); save(); ui.tab = 'start'; render(); break;
      }
      case 'change-garden': S.garden = ''; ui = freshUi(); save(); render(); break;
      case 'reset':
        if (confirm('Alle Testdaten auf diesem Gerät löschen und neu beginnen?')) {
          try { localStorage.removeItem(KEY); } catch (e) {}
          S = defaults(); ui = freshUi(); render();
        }
        break;
      // Tauschbörse
      case 'filter': ui.filter = b.dataset.f; render(); break;
      case 'open-form': ui.form = true; render(); var f = document.getElementById('f-title'); if (f) f.focus(); break;
      case 'cancel': ui.form = false; ui.newTitle = ''; ui.newText = ''; render(); break;
      case 'type': ui.newType = b.dataset.t; render(); break;
      case 'submit': {
        var title = ui.newTitle.trim();
        if (!title) return;
        S.entries.unshift({ id: S.nextId++, type: ui.newType, title: title, text: ui.newText.trim(), garden: S.garden, ts: Date.now() });
        save(); ui.form = false; ui.newTitle = ''; ui.newText = ''; ui.filter = 'alle';
        render(); toast('Eintrag veröffentlicht.'); break;
      }
      case 'delete':
        if (confirm('Diesen Eintrag löschen?')) {
          var id = Number(b.dataset.id);
          S.entries = S.entries.filter(function (e) { return e.id !== id; });
          save(); render(); toast('Eintrag gelöscht.');
        }
        break;
      case 'message': toast('In der echten App kannst du hier den Garten anschreiben.'); break;
      // Licht
      case 'light': {
        if (lightState() !== 'ready') return;
        var min = Number(b.dataset.min), now = Date.now();
        S.lightUntil = now + min * 60000;
        S.cooldownUntil = S.lightUntil + COOLDOWN_MS;
        S.log.unshift({ garden: S.garden, ts: now, min: min });
        S.log = S.log.slice(0, 20);
        save(); render(); toast('Wegelicht ist an.'); break;
      }
      case 'stop': { var tn = Date.now(); S.lightUntil = tn; S.cooldownUntil = tn + COOLDOWN_MS; save(); render(); break; }
      case 'skip': S.cooldownUntil = 0; save(); render(); break;
      // Gemeinschaftsarbeit Mitglied
      case 'ics': t = gaById(b.dataset.id); if (t) downloadIcs(t); break;
      case 'excuse-open':
        t = gaById(b.dataset.id);
        if (!t) return;
        if (t.date < todayIso()) { toast('Der Termin ist schon vorbei.'); return; }
        ui.excuseFor = t.id; ui.excuseText = ''; render();
        var xt = document.getElementById('x-text'); if (xt) xt.focus();
        break;
      case 'excuse-cancel': ui.excuseFor = ''; ui.excuseText = ''; render(); break;
      case 'excuse-send': {
        var txt = ui.excuseText.trim();
        if (!txt || !ui.excuseFor) return;
        S.excuses.push({ id: 'x' + (S.nextId++), terminId: ui.excuseFor, garden: S.garden, text: txt, ts: Date.now() });
        save(); ui.excuseFor = ''; ui.excuseText = ''; render(); toast('Entschuldigung abgeschickt.'); break;
      }
      case 'excuse-withdraw':
        if (confirm('Entschuldigung zurückziehen?')) {
          var tid = b.dataset.id;
          S.excuses = S.excuses.filter(function (x) { return !(x.terminId === tid && x.garden === S.garden); });
          save(); render();
        }
        break;
      // Einstellungen
      case 'remind': S.remindDays = Number(b.dataset.d); save(); render(); break;
      case 'admin-login': {
        var pin = document.getElementById('a-pin').value;
        if (pin === ADMIN_PIN) { ui.admin = true; render(); toast('Adminbereich entsperrt.'); }
        else toast('PIN falsch.');
        break;
      }
      case 'admin-logout': ui.admin = false; ui.sview = ''; render(); break;
      case 'sview': ui.sview = b.dataset.v; ui.noteFor = ''; render(); document.getElementById('main').scrollTop = 0; break;
      // Admin: Planung
      case 'ga-add': {
        var d = document.getElementById('n-date').value, g = document.getElementById('n-group').value;
        if (!d) { toast('Bitte ein Datum wählen.'); return; }
        S.ga.push({ id: 'ga' + (S.nextId++), date: d, group: g, add: [], skip: [] });
        save(); rerenderKeepScroll(); toast('Termin angelegt: ' + dShort(d) + '.'); break;
      }
      case 'ga-del':
        t = gaById(b.dataset.id);
        if (t && confirm('Termin am ' + dShort(t.date) + ' löschen?')) {
          S.ga = S.ga.filter(function (x) { return x.id !== t.id; });
          delete S.att[t.id];
          // Verlegungen auf den gelöschten Termin auflösen
          S.ga.forEach(function (x) {
            var m = x.moved || {};
            Object.keys(m).forEach(function (k) { if (m[k] === t.id) delete m[k]; });
          });
          save(); rerenderKeepScroll();
        }
        break;
      // Admin: Anwesenheit
      case 'att-pick': ui.attFor = b.dataset.id; rerenderKeepScroll(); break;
      case 'att-all':
        t = gaById(ui.attFor);
        if (t) { var bA = countsFor(yearOf(t)); S.att[t.id] = gardensOf(t); noteNewlyDone(yearOf(t), bA); save(); rerenderKeepScroll(); }
        break;
      case 'att-none': t = gaById(ui.attFor); if (t) { S.att[t.id] = []; save(); rerenderKeepScroll(); } break;
      case 'att-add': {
        t = gaById(ui.attFor); if (!t) return;
        var an = parseInt(document.getElementById('att-add').value, 10);
        if (!an || an < 1) { toast('Bitte eine Gartennummer eingeben.'); return; }
        if (excluded(yearOf(t), an)) { toast('Garten ' + an + ' ist als frei/befreit vermerkt.'); return; }
        if ((t.moved || {})[an]) { toast('Garten ' + an + ' ist auf einen anderen Termin verlegt.'); return; }
        var bB = countsFor(yearOf(t));
        t.add = t.add || [];
        if (t.add.indexOf(an) < 0 && gardensOf(t).indexOf(an) < 0) t.add.push(an);
        t.skip = (t.skip || []).filter(function (x) { return x !== an; });
        var pl = S.att[t.id] || [];
        if (pl.indexOf(an) < 0) pl.push(an);
        S.att[t.id] = pl;
        noteNewlyDone(yearOf(t), bB);
        save(); rerenderKeepScroll(); break;
      }
      // Admin: Verlegen
      case 'ga-move': {
        var mg = parseInt(document.getElementById('m-garden').value, 10);
        var from = gaById(document.getElementById('m-from').value), to = gaById(document.getElementById('m-to').value);
        if (!mg || !from || !to) { toast('Bitte Garten und beide Termine wählen.'); return; }
        if (from.id === to.id) { toast('Von und Nach sind derselbe Termin.'); return; }
        if (gardensOf(from).indexOf(mg) < 0) { toast('Garten ' + mg + ' ist am ' + dShort(from.date).slice(4, 10) + ' nicht eingeplant.'); return; }
        from.moved = from.moved || {}; from.moved[mg] = to.id;
        to.add = to.add || []; if (to.add.indexOf(mg) < 0) to.add.push(mg);
        to.skip = (to.skip || []).filter(function (x) { return x !== mg; });
        save(); rerenderKeepScroll(); toast('Garten ' + mg + ' verlegt auf ' + dShort(to.date).slice(4, 10) + '.'); break;
      }
      case 'move-undo': {
        var mf = gaById(b.dataset.from), mn = Number(b.dataset.n);
        if (!mf || !mf.moved) return;
        var mt = gaById(mf.moved[mn]);
        delete mf.moved[mn];
        if (mt) mt.add = (mt.add || []).filter(function (x) { return x !== mn; });
        save(); rerenderKeepScroll(); break;
      }
      // Admin: Jahresübersicht
      case 'year-pick': ui.year = b.dataset.y; ui.noteFor = ''; rerenderKeepScroll(); break;
      case 'done-seen': S.newDone = []; save(); rerenderKeepScroll(); break;
      case 'note-open': ui.noteFor = ui.noteFor === b.dataset.n ? '' : b.dataset.n; rerenderKeepScroll(); break;
      case 'note-cancel': ui.noteFor = ''; rerenderKeepScroll(); break;
      case 'note-save': {
        var y = pickYear(), nn = b.dataset.n;
        var st = document.getElementById('nt-status').value, tx = document.getElementById('nt-text').value.trim();
        S.notes[y] = S.notes[y] || {};
        if (!st && !tx) delete S.notes[y][nn]; else S.notes[y][nn] = { status: st, text: tx };
        ui.noteFor = ''; save(); rerenderKeepScroll(); toast('Vermerk gespeichert.'); break;
      }
      case 'mail-kw': {
        var yy = pickYear();
        var to2 = (S.treasurer || '').trim();
        var subj = 'Gemeinschaftsarbeit ' + yy + ' – ' + (yearData(yy).finished ? 'Jahresabschluss' : 'Zwischenstand');
        location.href = 'mailto:' + encodeURIComponent(to2).replace('%40', '@') + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(mailBody(yy));
        break;
      }
      case 'csv': {
        var yc = pickYear(), name = 'gemeinschaftsarbeit-' + yc + '.csv';
        var data = csvFor(yc);
        var file = null;
        try { file = new File([data], name, { type: 'text/csv' }); } catch (e) {}
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: 'Gemeinschaftsarbeit ' + yc }).catch(function () {});
        } else {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([data], { type: 'text/csv' }));
          a.download = name; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
          toast('Liste gespeichert: ' + name);
        }
        break;
      }
      // Zählerstände
      case 'mread-add': {
        var rn = document.getElementById('r-name').value.trim(), rdt = document.getElementById('r-date').value;
        if (!rn || !rdt) { toast('Bitte Name und Datum angeben.'); return; }
        var nr = { id: 'r' + (S.nextId++), name: rn, date: rdt, created: Date.now() };
        M().readings.push(nr); save();
        ui.mread = nr.id; ui.sview = 'mread'; ui.mfilter = 'alle'; render(); document.getElementById('main').scrollTop = 0;
        toast('Ablesung angelegt.'); break;
      }
      case 'mread-open': ui.mread = b.dataset.id; ui.sview = 'mread'; ui.mfilter = 'alle'; render(); document.getElementById('main').scrollTop = 0; break;
      case 'mread-del': {
        var dr = readingById(b.dataset.id);
        if (dr && confirm('Ablesung „' + dr.name + '“ mit allen Werten löschen?')) {
          M().readings = M().readings.filter(function (x) { return x.id !== dr.id; });
          delete M().vals[dr.id]; save(); rerenderKeepScroll();
        }
        break;
      }
      case 'mfilter': ui.mfilter = b.dataset.f; rerenderKeepScroll(); break;
      case 'dist-add': {
        var dn = document.getElementById('d-name').value.trim(), dg = parseRanges(document.getElementById('d-gardens').value);
        if (!dn || !dg.length) { toast('Bitte Name und Gärten angeben.'); return; }
        M().dist.push({ id: 'v' + (S.nextId++), name: dn, type: document.getElementById('d-type').value, gardens: dg });
        save(); rerenderKeepScroll(); toast('Verteiler angelegt.'); break;
      }
      case 'dist-del': {
        var dd = distById(b.dataset.id);
        if (dd && confirm('Verteiler „' + dd.name + '“ löschen?')) { M().dist = M().dist.filter(function (x) { return x.id !== dd.id; }); save(); rerenderKeepScroll(); }
        break;
      }
      case 'meter-demo': {
        var demo = { id: 'r' + (S.nextId++), name: 'Herbst 2026', date: '2026-10-17', created: Date.now() - 1000 };
        var dv = {};
        meterGardens().forEach(function (gn) {
          dv['g' + gn] = { w: Math.round((80 + (gn * 37) % 420 + (gn % 7) / 10) * 10) / 10, s: 800 + (gn * 389) % 5200 };
        });
        dv.main = { w: 18450.5, s: 412300 };
        if (!M().dist.length) M().dist.push({ id: 'v' + (S.nextId++), name: 'Verteiler Nord (Strom)', type: 's', gardens: parseRanges('2-30') });
        M().dist.forEach(function (x) { dv['d' + x.id] = { v: 98000 + x.gardens.length * 10 }; });
        M().readings.push(demo); M().vals[demo.id] = dv; save(); rerenderKeepScroll();
        toast('Beispiel-Ablesung „Herbst 2026“ erzeugt.'); break;
      }
      case 'meter-mail': {
        var mr = readingById(ui.mread); if (!mr) return;
        location.href = 'mailto:' + encodeURIComponent((S.treasurer || '').trim()).replace('%40', '@') +
          '?subject=' + encodeURIComponent('Zählerstände ' + mr.name) + '&body=' + encodeURIComponent(meterMail(mr.id));
        break;
      }
      case 'meter-csv': {
        var cr = readingById(ui.mread); if (!cr) return;
        shareOrDownload(meterCsv(cr.id), 'zaehlerstaende-' + cr.date + '.csv', 'Zählerstände ' + cr.name);
        break;
      }
      case 'rg-start': rgGo(ui.mread, null); render(); document.getElementById('main').scrollTop = 0; break;
      case 'rg-at': rgGo(ui.mread, Number(b.dataset.n)); render(); document.getElementById('main').scrollTop = 0; break;
      case 'rg-prev': rgMove(ui.rg.idx - 1); render(); document.getElementById('main').scrollTop = 0; break;
      case 'rg-skip':
        if (ui.rg.idx >= meterGardens().length - 1) { toast('Letzter Garten erreicht.'); return; }
        rgMove(ui.rg.idx + 1); render(); document.getElementById('main').scrollTop = 0; break;
      case 'rg-jump': {
        var jn = parseInt(document.getElementById('rg-jump').value, 10), jgs = meterGardens();
        if (jgs.indexOf(jn) < 0) { toast('Garten ' + (jn || '?') + ' gibt es nicht.'); return; }
        rgMove(jgs.indexOf(jn)); render(); document.getElementById('main').scrollTop = 0; break;
      }
      case 'rg-save': rgSave(); break;
      case 'rg-exit': ui.sview = 'mread'; ui.rg = null; render(); break;
    }
  });

  document.addEventListener('change', function (ev) {
    var el = ev.target, ds = el.dataset || {};
    if (ds.act === 'lan') { S.inLan = el.checked; save(); render(); return; }
    if (ds.act === 'dark') { S.dark = el.checked; save(); render(); return; }
    if (ds.att) {
      var t = gaById(ui.attFor); if (!t) return;
      var n = Number(ds.att), list = (S.att[t.id] || []).filter(function (x) { return x !== n; });
      var before = countsFor(yearOf(t));
      if (el.checked) list.push(n);
      S.att[t.id] = list;
      noteNewlyDone(yearOf(t), before);
      save(); rerenderKeepScroll(); return;
    }
    if (ds.set === 'treasurer') { S.treasurer = el.value.trim(); save(); toast('E-Mail gespeichert.'); return; }
    if (ds.dr && ui.rg) {
      var key = ds.dr;
      if (el.type === 'checkbox') {
        ui.rg.draft[key] = el.checked;
        if (/T$/.test(key)) rerenderKeepScroll();
      } else if (el.type === 'radio') {
        ui.rg.draft[key] = el.value;
      }
      return;
    }
    if (ds.mv && ui.mread) {
      var mvVal = parseNum(el.value);
      if (mvVal !== null && isNaN(mvVal)) { toast('Keine gültige Zahl.'); return; }
      var mvs = M().vals[ui.mread] = M().vals[ui.mread] || {};
      var o = mvs[ds.mv] || {};
      if (mvVal === null) delete o[ds.k]; else o[ds.k] = mvVal;
      if (Object.keys(o).length) mvs[ds.mv] = o; else delete mvs[ds.mv];
      save(); rerenderKeepScroll(); toast('Gespeichert.'); return;
    }
    if (ds.dist) {
      var dd = distById(ds.dist); if (!dd) return;
      if (ds.k === 'gardens') { var pg = parseRanges(el.value); if (!pg.length) { toast('Bitte Gärten angeben.'); rerenderKeepScroll(); return; } dd.gardens = pg; }
      else if (ds.k === 'name') { if (!el.value.trim()) return; dd.name = el.value.trim(); }
      else dd[ds.k] = el.value;
      save(); rerenderKeepScroll(); toast('Verteiler gespeichert.'); return;
    }
    if (ds.ga) {
      var g = gaById(ds.ga); if (!g) return;
      if (ds.k === 'date') { if (!el.value) return; g.date = el.value; }
      else if (ds.k === 'group') g.group = el.value;
      else g[ds.k] = numList(el.value);
      save(); rerenderKeepScroll(); toast('Gespeichert.'); return;
    }
    if (ds.grp) {
      var gr = groupById(ds.grp); var v = parseInt(el.value, 10);
      if (!gr || !v || v < 1) { rerenderKeepScroll(); return; }
      gr[ds.k] = v;
      if (gr.from > gr.to) { var tmp = gr.from; gr.from = gr.to; gr.to = tmp; }
      save(); rerenderKeepScroll(); toast('Gruppe gespeichert.');
    }
  });

  document.addEventListener('input', function (ev) {
    var dr = ev.target.dataset && ev.target.dataset.dr;
    if (dr && ui.rg && ev.target.type !== 'checkbox' && ev.target.type !== 'radio') {
      ui.rg.draft[dr] = ev.target.value;
      ['w', 's'].forEach(function (k) { var c = document.getElementById('cons-' + k); if (c) c.innerHTML = consText(k); });
      return;
    }
    var fld = ev.target.dataset && ev.target.dataset.field;
    if (!fld) return;
    ui[fld] = ev.target.value;
    var sb = document.getElementById('f-submit'); if (sb) sb.disabled = !ui.newTitle.trim();
    var xb = document.getElementById('x-submit'); if (xb) xb.disabled = !ui.excuseText.trim();
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    if (ev.target.id === 'w-garden') { var w = document.querySelector('[data-act="welcome"]'); if (w) w.click(); }
    if (ev.target.id === 'a-pin') { var a = document.querySelector('[data-act="admin-login"]'); if (a) a.click(); }
    if (ev.target.id === 'rg-jump') { var j = document.querySelector('[data-act="rg-jump"]'); if (j) j.click(); }
    if (ev.target.dataset && ev.target.dataset.dr === 'w') { var sIn = document.querySelector('[data-dr="s"]'); if (sIn) { ev.preventDefault(); sIn.focus(); } }
    else if (ev.target.dataset && ev.target.dataset.dr === 's') { ev.preventDefault(); ev.target.blur(); var sv = document.querySelector('[data-act="rg-save"]'); if (sv) sv.click(); }
  });

  var lastState = lightState();
  setInterval(function () {
    var st = lightState();
    if (st !== lastState) { lastState = st; if (ui.tab === 'licht' || (ui.tab === 'start' && !ui.excuseFor)) render(); return; }
    if (st === 'on') { var c = document.getElementById('count'); if (c) c.textContent = fmt(S.lightUntil - Date.now()); }
    if (st === 'cooldown') { var k = document.getElementById('cool'); if (k) k.textContent = fmt(S.cooldownUntil - Date.now()); }
    var tl = document.getElementById('tile-light'); if (tl) tl.textContent = lightTileText();
  }, 1000);

  render();

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
