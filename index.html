<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B3B">
<meta name="color-scheme" content="light">
<title>Jägerteich</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#2E6B3B; --accent-dark:#1E4A28; --accent-soft:#E3F0DE;
  --bg:#F6F4EC; --card:#FFFFFF; --line:#ECE8DB; --shadow:#E4E0D2;
  --text:#1F2A21; --text2:#3A4A3E; --muted:#56645A;
  --sun:#FFEDB8; --sun-ink:#3D2E00; --sky:#D7ECFB; --sky-ink:#0D3354; --sky-strong:#1F5E91;
  --peach:#FFE1C7; --peach-ink:#6E3005; --orange:#9A4A0C;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;color:var(--text);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
input,textarea{font-family:inherit}
.app{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

header{position:relative;background:var(--accent);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 22px 34px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.test-tag{margin-left:auto;background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;font-size:12px;letter-spacing:.04em}
h1{margin:2px 0 0;font-size:32px;font-weight:900;line-height:1.1}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:22px;display:block}

main{flex:1 1 auto;overflow-y:auto;padding:8px 18px 24px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
section{display:flex;flex-direction:column;gap:16px}

.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 2px 0 var(--shadow);display:flex;flex-direction:column;gap:8px}
.chip{align-self:flex-start;background:var(--accent-soft);color:var(--accent-dark);font-size:14px;font-weight:800;padding:5px 12px;border-radius:999px}
.big{font-size:24px;font-weight:900;line-height:1.2}
.h2{font-size:22px;font-weight:900}
.sub{font-size:18px;color:var(--text2)}
.small{font-size:15px;color:var(--muted)}
.body{font-size:17px;color:var(--text2);line-height:1.45}
.center{text-align:center}

.btn{min-height:48px;padding:0 20px;border-radius:999px;font-size:17px;font-weight:800;border:2px solid var(--accent);background:#fff;color:var(--accent)}
.btn.primary{border:none;background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-dark);min-height:56px;font-size:19px;font-weight:900}
.btn.primary:disabled{background:#A3ADA5;box-shadow:none}
.btn.ghost{border:2px solid #D5D9CC;color:var(--text2)}
.btn.soft{border:none;background:var(--accent-soft);color:var(--accent-dark);min-height:46px;font-size:16px}
.btn.danger{border:none;background:#FBE3DF;color:#8A1F12;min-height:46px;font-size:16px}
.link{min-height:44px;border:none;background:transparent;color:var(--accent);font-size:17px;font-weight:800;padding:0 4px}
.self-start{align-self:flex-start}
.row{display:flex;gap:10px}
.row>.btn{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{min-height:132px;border-radius:26px;border:none;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:16px;text-align:left}
.tile.sun{background:var(--sun);color:var(--sun-ink)}
.tile.sky{background:var(--sky);color:var(--sky-ink)}
.tile .ico{width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center}
.tile .t1{font-size:19px;font-weight:900}
.tile .t2{font-size:15px;font-weight:700}

.mini{background:#fff;border-radius:22px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 2px 0 var(--shadow)}
.mini .col{display:flex;flex-direction:column;gap:2px;min-width:0}
.mini .tt{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.badge{flex-shrink:0;font-size:14px;font-weight:900;padding:6px 14px;border-radius:999px}
.badge.suche{background:var(--sky);color:var(--sky-ink)}
.badge.biete{background:var(--peach);color:var(--peach-ink)}
.badge.own{background:var(--accent-soft);color:var(--accent-dark)}

.seg{display:flex;gap:6px;background:var(--line);padding:5px;border-radius:999px}
.seg button{flex:1;min-height:46px;border-radius:999px;border:none;font-size:17px;font-weight:800;padding:0 10px;background:transparent;color:var(--text2)}
.seg button.on{color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.seg button.on.alle{background:var(--text)}
.seg button.on.suche{background:var(--sky-strong)}
.seg button.on.biete{background:var(--orange)}

label.lbl{font-size:16px;font-weight:800;color:var(--text2)}
.field{width:100%;min-height:52px;border:2px solid #D5D9CC;border-radius:16px;padding:0 14px;font-size:18px;color:var(--text);background:#fff}
textarea.field{padding:12px 14px;resize:none;min-height:96px}
.field:focus{outline:none;border-color:var(--accent)}

.entry .title{font-size:21px;font-weight:900;line-height:1.2;word-break:break-word}
.entry .garden{font-size:16px;font-weight:700;color:var(--muted)}

.termin{flex-direction:row;gap:16px;align-items:flex-start}
.date{width:64px;flex-shrink:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0}
.date .wd{font-size:14px;font-weight:800;text-transform:uppercase}
.date .d{font-size:28px;font-weight:900;line-height:1}
.date .m{font-size:14px;font-weight:700}
.date.c0{background:var(--accent-soft);color:var(--accent-dark)}
.date.c1{background:var(--sky);color:var(--sky-ink)}
.date.c2{background:var(--peach);color:var(--peach-ink)}

.demo{display:flex;flex-direction:column;gap:2px;background:#FFF6DB;border:2px dashed #C99A1E;border-radius:18px;padding:6px 16px;color:#5A4307}
.demo .ttl{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding-top:6px}
.demo label{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;font-size:16px;font-weight:700}
.demo input{width:24px;height:24px;accent-color:#8A6A10}

.on-card{background:#1E3524;color:#fff;border-radius:30px;padding:30px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.bulb{width:96px;height:96px;border-radius:999px;background:#FFE27A;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(255,226,122,.18)}
.count{font-size:52px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.on-card .btn{border-color:#fff;background:transparent;color:#fff;min-height:52px}
.sun-card{background:var(--sun);border-radius:30px;padding:22px;display:flex;flex-direction:column;gap:14px;color:var(--sun-ink)}
.minbtn{min-height:84px;border-radius:22px;border:none;background:#fff;color:var(--sun-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 #E2C46A}
.minbtn .n{font-size:30px;font-weight:900;line-height:1}
.minbtn .u{font-size:15px;font-weight:700}
.lock{width:52px;height:52px;border-radius:16px;background:var(--line);display:flex;align-items:center;justify-content:center}
.logrow{display:flex;justify-content:space-between;font-size:16px;color:var(--text2);border-bottom:2px solid var(--line);padding:8px 0}
.logrow b{font-weight:800}

.notice{background:var(--sky);border-radius:22px;padding:16px 18px;font-size:17px;color:var(--sky-ink);line-height:1.45}
.sensor{flex-direction:row;justify-content:space-between;align-items:center;gap:12px}
.temp{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--sky-strong);text-align:right}

nav{flex-shrink:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:#fff;border-top:2px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom))}
nav button{min-height:58px;border:none;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:800;background:transparent;color:var(--muted)}
nav button.on{background:var(--accent-soft);color:var(--accent-dark)}
nav.hidden{display:none}

#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:12px 18px;border-radius:16px;font-size:16px;font-weight:700;max-width:calc(100% - 40px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 4 13c0-5 4-9 16-9 0 12-4 16-9 16z"/><path d="M4 21c3-5 6-8 10-10"/></svg>
      <span>KGV Jägerteich</span>
      <span class="test-tag">Testversion</span>
    </div>
    <h1 id="title">Moin!</h1>
    <svg class="wave" viewBox="0 0 390 22" preserveAspectRatio="none" aria-hidden="true"><path d="M0 22 C 60 2, 120 2, 195 12 S 330 24, 390 6 L 390 22 Z" fill="#F6F4EC"/></svg>
  </header>

  <main id="main" aria-live="polite"></main>

  <nav id="nav" aria-label="Hauptnavigation">
    <button data-act="tab" data-tab="start"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Start</span></button>
    <button data-act="tab" data-tab="boerse"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/></svg><span>Tausch</span></button>
    <button data-act="tab" data-tab="termine"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M3 10h18"/></svg><span>Termine</span></button>
    <button data-act="tab" data-tab="licht"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg><span>Licht</span></button>
    <button data-act="tab" data-tab="wetter"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg><span>Wetter</span></button>
  </nav>
</div>
<div id="toast" role="status"></div>

<script>
(function () {
  'use strict';

  // Bei jedem Update hochzählen, zusammen mit VERSION in sw.js
  var APP_VERSION = '0.1.0';
  var COPYRIGHT = '© ' + new Date().getFullYear() + ' KGV Jägerteich';
  function footer() {
    return '<div class="small center">Testversion ' + APP_VERSION + ' · ' + COPYRIGHT + '</div>';
  }

  var KEY = 'jaegerteich-test-v1';
  var DAY = 86400000;
  var EXPIRE_DAYS = 28;
  var COOLDOWN_MS = 15 * 60000;

  var ICON = {
    bulb: function (c, s) { return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="' + c + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>'; },
    therm: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1F5E91" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg>',
    lock: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#56645A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
    sun: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#56645A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
  };

  var TERMINE = [
    { wd: 'Sa', d: '07', m: 'Nov', title: 'Herbst-Arbeitseinsatz', time: '10:00 Uhr · Vereinsheim', text: 'Laub, Hecken, Wege. Werkzeug bitte mitbringen.' },
    { wd: 'Sa', d: '14', m: 'Nov', title: 'Wasser wird abgestellt', time: 'ab 9:00 Uhr', text: 'Bis dahin Wasseruhr ablesen und Leitungen entleeren.' },
    { wd: 'Sa', d: '28', m: 'Nov', title: 'Adventsbasteln', time: '15:00 Uhr · Vereinsheim', text: 'Für Groß und Klein, mit Kaffee und Kuchen.' }
  ];

  var SENSORS = [
    { name: 'Vereinsheim außen', temp: '6,4 °C', hum: '88 % rF', min: '2,8 °C', age: 'vor 3 min' },
    { name: 'Teich', temp: '5,9 °C', hum: '91 % rF', min: '2,1 °C', age: 'vor 2 min' },
    { name: 'Dreieck', temp: '6,1 °C', hum: '86 % rF', min: '2,5 °C', age: 'vor 4 min' },
    { name: 'Vereinsheim innen', temp: '14,2 °C', hum: '62 % rF', min: '11,9 °C', age: 'vor 1 min' }
  ];

  function defaults() {
    var now = Date.now();
    return {
      garden: '',
      nextId: 100,
      inLan: true,
      dark: true,
      lightUntil: 0,
      cooldownUntil: 0,
      log: [
        { garden: '48', ts: now - DAY - 3 * 3600000, min: 10 },
        { garden: '7', ts: now - 2 * DAY - 2 * 3600000, min: 5 }
      ],
      entries: [
        { id: 1, type: 'biete', title: 'Äpfel Boskoop', text: 'Eine Kiste steht am Vereinsheim, bitte bedienen.', garden: '48', ts: now - 2 * 3600000 },
        { id: 2, type: 'suche', title: 'Häcksler leihen', text: 'Für ein Wochenende, gerne gegen Kuchen.', garden: '71', ts: now - DAY },
        { id: 3, type: 'biete', title: 'Gartenbank aus Holz', text: 'Zustand gut, muss abgeholt werden.', garden: '5', ts: now - 3 * DAY },
        { id: 4, type: 'suche', title: 'Tulpenzwiebeln', text: '', garden: '102', ts: now - 5 * DAY },
        { id: 5, type: 'biete', title: 'Kürbisse Hokkaido', text: 'Etwa 6 Stück, gegen Spende in die Vereinskasse.', garden: '23', ts: now - 7 * DAY }
      ]
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        var d = defaults();
        for (var k in d) { if (!(k in s)) s[k] = d[k]; }
        return s;
      }
    } catch (e) {}
    return defaults();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var S = load();
  var ui = { tab: 'start', filter: 'alle', form: false, newType: 'biete', newTitle: '', newText: '' };

  // abgelaufene Einträge entfernen
  S.entries = S.entries.filter(function (e) { return Date.now() - e.ts < EXPIRE_DAYS * DAY; });
  save();

  // ---------- Helfer ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(ms) { var s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + pad(s % 60); }
  function rel(ts) {
    var d0 = new Date(); d0.setHours(0, 0, 0, 0);
    var diff = Math.floor((d0.getTime() - ts) / DAY) + 1;
    if (ts >= d0.getTime()) return 'heute';
    if (diff <= 1) return 'gestern';
    if (diff < 7) return 'vor ' + diff + ' Tagen';
    if (diff < 14) return 'vor 1 Woche';
    return 'vor ' + Math.floor(diff / 7) + ' Wochen';
  }
  function clock(ts) {
    var d = new Date(ts);
    var day = rel(ts);
    if (day.indexOf('vor') === 0) day = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][d.getDay()];
    return day + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }
  function lightState() {
    var now = Date.now();
    if (now < S.lightUntil) return 'on';
    if (now < S.cooldownUntil) return 'cooldown';
    if (!S.inLan) return 'lan';
    if (!S.dark) return 'bright';
    return 'ready';
  }

  // ---------- Bausteine ----------
  function badge(e) {
    return '<span class="badge ' + e.type + '">' + (e.type === 'suche' ? 'Suche' : 'Biete') + '</span>';
  }
  function gardenLabel(g) { return g === S.garden ? 'Dein Garten (' + esc(g) + ')' : 'Garten ' + esc(g); }

  // ---------- Ansichten ----------
  function viewWelcome() {
    return '<section>' +
      '<div class="card">' +
        '<div class="big">Willkommen!</div>' +
        '<div class="body">Das ist die Testversion der Vereins-App. Gib deine Gartennummer ein, damit deine Einträge in der Tauschbörse richtig zugeordnet werden.</div>' +
        '<label class="lbl" for="w-garden">Gartennummer</label>' +
        '<input class="field" id="w-garden" type="number" inputmode="numeric" min="1" max="200" placeholder="z. B. 48">' +
        '<div class="small">In der echten App meldest du dich einmalig mit dem Code deines Gartens an, derselbe wie fürs WLAN.</div>' +
        '<button class="btn primary" data-act="welcome">Los geht\'s</button>' +
      '</div>' +
      '<div class="small center">Alle Daten bleiben in dieser Testversion nur auf diesem Gerät.</div>' +
      footer() +
    '</section>';
  }

  function lightTileText() {
    var st = lightState();
    if (st === 'on') return 'an · noch ' + fmt(S.lightUntil - Date.now());
    if (st === 'cooldown') return 'Pause · ' + fmt(S.cooldownUntil - Date.now());
    if (st === 'bright') return 'aus · noch zu hell';
    if (st === 'lan') return 'aus · nur vor Ort';
    return 'aus · tippen';
  }

  function viewStart() {
    var t = TERMINE[0];
    var latest = S.entries.slice(0, 2).map(function (e) {
      return '<div class="mini">' + badge(e) +
        '<div class="col"><span class="tt">' + esc(e.title) + '</span>' +
        '<span class="small">' + gardenLabel(e.garden) + ' · ' + rel(e.ts) + '</span></div></div>';
    }).join('');
    if (!latest) latest = '<div class="small">Noch keine Einträge.</div>';
    return '<section>' +
      '<div class="card">' +
        '<span class="chip">Nächster Termin</span>' +
        '<div class="big">' + esc(t.title) + '</div>' +
        '<div class="sub">' + t.wd + ', ' + t.d + '.11. · ' + esc(t.time) + '</div>' +
        '<button class="btn self-start" data-act="tab" data-tab="termine">Alle Termine</button>' +
      '</div>' +
      '<div class="tiles">' +
        '<button class="tile sun" data-act="tab" data-tab="licht"><span class="ico">' + ICON.bulb('#9A6A00', 26) + '</span><span class="t1">Wegelicht</span><span class="t2" id="tile-light">' + lightTileText() + '</span></button>' +
        '<button class="tile sky" data-act="tab" data-tab="wetter"><span class="ico">' + ICON.therm + '</span><span class="t1">6,4 °C</span><span class="t2">Vereinsheim außen</span></button>' +
      '</div>' +
      '<div class="between"><div class="h2">Neu im Tausch</div><button class="link" data-act="tab" data-tab="boerse">Alle ansehen</button></div>' +
      latest +
      '<div class="card">' +
        '<span class="chip">Testversion</span>' +
        '<div class="body">Angemeldet als <b>Garten ' + esc(S.garden) + '</b>. Einträge, Licht und Protokoll werden nur auf diesem Gerät gespeichert, andere sehen sie nicht.</div>' +
        '<div class="row"><button class="btn ghost" data-act="change-garden">Garten ändern</button><button class="btn ghost" data-act="reset">Zurücksetzen</button></div>' +
      '</div>' +
      footer() +
    '</section>';
  }

  function viewBoerse() {
    var f = ui.filter;
    var seg = '<div class="seg" role="group" aria-label="Filter">' +
      '<button class="alle' + (f === 'alle' ? ' on' : '') + '" data-act="filter" data-f="alle">Alle</button>' +
      '<button class="suche' + (f === 'suche' ? ' on' : '') + '" data-act="filter" data-f="suche">Suche</button>' +
      '<button class="biete' + (f === 'biete' ? ' on' : '') + '" data-act="filter" data-f="biete">Biete</button></div>';

    var form;
    if (ui.form) {
      var nt = ui.newType;
      form = '<div class="card">' +
        '<div class="h2">Neuer Eintrag</div>' +
        '<div class="seg" role="group" aria-label="Art">' +
          '<button class="suche' + (nt === 'suche' ? ' on' : '') + '" data-act="type" data-t="suche">Ich suche</button>' +
          '<button class="biete' + (nt === 'biete' ? ' on' : '') + '" data-act="type" data-t="biete">Ich biete</button></div>' +
        '<label class="lbl" for="f-title">Was?</label>' +
        '<input class="field" id="f-title" data-field="newTitle" type="text" maxlength="60" placeholder="z. B. Häcksler leihen" value="' + esc(ui.newTitle) + '">' +
        '<label class="lbl" for="f-text">Beschreibung (optional)</label>' +
        '<textarea class="field" id="f-text" data-field="newText" rows="3" maxlength="300" placeholder="Zustand, Abholung, Gegenleistung …">' + esc(ui.newText) + '</textarea>' +
        '<div class="small">Läuft nach 4 Wochen ab. Nur für Vereinsmitglieder sichtbar.</div>' +
        '<div class="row"><button class="btn ghost" data-act="cancel">Abbrechen</button>' +
        '<button class="btn primary" id="f-submit" data-act="submit"' + (ui.newTitle.trim() ? '' : ' disabled') + '>Posten</button></div>' +
      '</div>';
    } else {
      form = '<button class="btn primary" data-act="open-form">+ Neuer Eintrag</button>';
    }

    var list = S.entries.filter(function (e) { return f === 'alle' || e.type === f; }).map(function (e) {
      var own = e.garden === S.garden;
      return '<article class="card entry">' +
        '<div class="between">' + badge(e) + '<span class="small">' + rel(e.ts) + '</span></div>' +
        '<div class="title">' + esc(e.title) + '</div>' +
        (e.text ? '<div class="body">' + esc(e.text) + '</div>' : '') +
        '<div class="between"><span class="garden">' + gardenLabel(e.garden) + '</span>' +
        (own ? '<button class="btn danger" data-act="delete" data-id="' + e.id + '">Löschen</button>'
             : '<button class="btn soft" data-act="message">Nachricht</button>') +
        '</div></article>';
    }).join('');
    if (!list) list = '<div class="small center">Keine Einträge in dieser Auswahl.</div>';

    return '<section>' + seg + form + list + '</section>';
  }

  function viewTermine() {
    return '<section>' + TERMINE.map(function (t, i) {
      return '<div class="card termin">' +
        '<div class="date c' + (i % 3) + '"><span class="wd">' + t.wd + '</span><span class="d">' + t.d + '</span><span class="m">' + t.m + '</span></div>' +
        '<div style="display:flex;flex-direction:column;gap:4px;min-width:0">' +
          '<span class="h2" style="font-size:20px;line-height:1.2">' + esc(t.title) + '</span>' +
          '<span class="small" style="font-weight:700">' + esc(t.time) + '</span>' +
          '<span class="body">' + esc(t.text) + '</span></div></div>';
    }).join('') + '<div class="small center">Termine pflegt der Vorstand. In der Testversion sind es Beispiele.</div></section>';
  }

  function viewLicht() {
    var st = lightState();
    var demo = '<div class="demo"><div class="ttl">Simulation (nur Test)</div>' +
      '<label><span>Handy ist im Vereins-WLAN</span><input type="checkbox" data-act="lan"' + (S.inLan ? ' checked' : '') + '></label>' +
      '<label><span>Draußen ist es dunkel</span><input type="checkbox" data-act="dark"' + (S.dark ? ' checked' : '') + '></label></div>';
    var main = '';
    if (st === 'on') {
      main = '<div class="on-card"><span class="bulb">' + ICON.bulb('#5A4300', 52) + '</span>' +
        '<div class="h2" style="margin-top:8px">Licht ist an</div>' +
        '<div class="count" id="count">' + fmt(S.lightUntil - Date.now()) + '</div>' +
        '<div style="font-size:16px;opacity:.85">geht von selbst wieder aus</div>' +
        '<button class="btn" data-act="stop">Jetzt ausschalten</button></div>';
    } else if (st === 'ready') {
      main = '<div class="sun-card"><div class="h2" style="font-size:23px">Licht anmachen</div>' +
        '<div class="body" style="color:inherit">Nach Ablauf der Zeit geht es automatisch wieder aus.</div>' +
        '<div class="tiles" style="gap:12px">' +
          '<button class="minbtn" data-act="light" data-min="5"><span class="n">5</span><span class="u">Minuten</span></button>' +
          '<button class="minbtn" data-act="light" data-min="10"><span class="n">10</span><span class="u">Minuten</span></button>' +
        '</div></div>';
    } else if (st === 'cooldown') {
      main = '<div class="card"><div class="h2">Kurze Pause</div>' +
        '<div class="body">Wieder möglich in <b id="cool" style="font-variant-numeric:tabular-nums">' + fmt(S.cooldownUntil - Date.now()) + '</b>. So bleibt das Licht nicht dauernd an.</div>' +
        '<button class="link self-start" data-act="skip">Pause überspringen (nur Test)</button></div>';
    } else if (st === 'lan') {
      main = '<div class="card"><span class="lock">' + ICON.lock + '</span><div class="h2">Nur vor Ort</div>' +
        '<div class="body">Das Licht lässt sich nur schalten, wenn dein Handy im WLAN der Anlage ist.</div></div>';
    } else {
      main = '<div class="card"><span class="lock">' + ICON.sun + '</span><div class="h2">Noch zu hell</div>' +
        '<div class="body">Das Wegelicht lässt sich erst ab der Dämmerung einschalten.</div></div>';
    }
    var log = S.log.slice(0, 5).map(function (l) {
      return '<div class="logrow"><b>' + (l.garden === S.garden ? 'Du' : 'Garten ' + esc(l.garden)) + '</b><span>' + clock(l.ts) + ' · ' + l.min + ' min</span></div>';
    }).join('');
    return '<section>' + demo + main +
      '<div style="display:flex;flex-direction:column;gap:6px"><div class="h2" style="font-size:18px">Zuletzt geschaltet</div>' + (log || '<div class="small">Noch nichts.</div>') + '</div>' +
    '</section>';
  }

  function viewWetter() {
    return '<section>' +
      '<div class="notice"><b>Frostgefahr:</b> Am Teich waren es letzte Nacht 2,1 °C. Außenleitungen prüfen.</div>' +
      SENSORS.map(function (s) {
        return '<div class="card sensor"><div style="display:flex;flex-direction:column;gap:4px">' +
          '<span class="h2" style="font-size:19px">' + s.name + '</span>' +
          '<span class="small">Tiefst 24 h: ' + s.min + ' · ' + s.age + '</span></div>' +
          '<div><div class="temp">' + s.temp + '</div><div class="small" style="text-align:right">' + s.hum + '</div></div></div>';
      }).join('') +
      '<div class="small center">Beispielwerte. In der echten App melden die Sensoren alle 5 Minuten.</div>' +
    '</section>';
  }

  var TITLES = { start: 'Moin!', boerse: 'Tauschbörse', termine: 'Termine', licht: 'Wegelicht', wetter: 'Temperaturen' };

  function render() {
    var main = document.getElementById('main');
    var nav = document.getElementById('nav');
    if (!S.garden) {
      document.getElementById('title').textContent = 'Willkommen';
      nav.classList.add('hidden');
      main.innerHTML = viewWelcome();
      return;
    }
    nav.classList.remove('hidden');
    document.getElementById('title').textContent = TITLES[ui.tab];
    var html = { start: viewStart, boerse: viewBoerse, termine: viewTermine, licht: viewLicht, wetter: viewWetter }[ui.tab]();
    main.innerHTML = html;
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function (b) {
      var on = b.dataset.tab === ui.tab;
      b.classList.toggle('on', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }

  // ---------- Aktionen ----------
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b || b.tagName === 'INPUT') return;
    var act = b.dataset.act;
    switch (act) {
      case 'tab':
        ui.tab = b.dataset.tab; render(); document.getElementById('main').scrollTop = 0; break;
      case 'welcome': {
        var v = document.getElementById('w-garden').value.trim();
        var n = parseInt(v, 10);
        if (!n || n < 1 || n > 200) { toast('Bitte eine gültige Gartennummer eingeben.'); return; }
        S.garden = String(n); save(); ui.tab = 'start'; render(); break;
      }
      case 'change-garden':
        S.garden = ''; save(); render(); break;
      case 'reset':
        if (confirm('Alle Testdaten auf diesem Gerät löschen und neu beginnen?')) {
          try { localStorage.removeItem(KEY); } catch (e) {}
          S = defaults(); ui = { tab: 'start', filter: 'alle', form: false, newType: 'biete', newTitle: '', newText: '' }; render();
        }
        break;
      case 'filter': ui.filter = b.dataset.f; render(); break;
      case 'open-form': ui.form = true; render(); var f = document.getElementById('f-title'); if (f) f.focus(); break;
      case 'cancel': ui.form = false; ui.newTitle = ''; ui.newText = ''; render(); break;
      case 'type': ui.newType = b.dataset.t; render(); break;
      case 'submit': {
        var title = ui.newTitle.trim();
        if (!title) return;
        S.entries.unshift({ id: S.nextId++, type: ui.newType, title: title, text: ui.newText.trim(), garden: S.garden, ts: Date.now() });
        save();
        ui.form = false; ui.newTitle = ''; ui.newText = ''; ui.filter = 'alle';
        render(); toast('Eintrag veröffentlicht.'); break;
      }
      case 'delete':
        if (confirm('Diesen Eintrag löschen?')) {
          var id = Number(b.dataset.id);
          S.entries = S.entries.filter(function (e) { return e.id !== id; });
          save(); render(); toast('Eintrag gelöscht.');
        }
        break;
      case 'message':
        toast('In der echten App kannst du hier den Garten anschreiben.'); break;
      case 'light': {
        if (lightState() !== 'ready') return;
        var min = Number(b.dataset.min);
        var now = Date.now();
        S.lightUntil = now + min * 60000;
        S.cooldownUntil = S.lightUntil + COOLDOWN_MS;
        S.log.unshift({ garden: S.garden, ts: now, min: min });
        S.log = S.log.slice(0, 20);
        save(); render(); toast('Wegelicht ist an.'); break;
      }
      case 'stop': {
        var t = Date.now();
        S.lightUntil = t; S.cooldownUntil = t + COOLDOWN_MS; save(); render(); break;
      }
      case 'skip': S.cooldownUntil = 0; save(); render(); break;
    }
  });

  document.addEventListener('change', function (ev) {
    var a = ev.target.dataset && ev.target.dataset.act;
    if (a === 'lan') { S.inLan = ev.target.checked; save(); render(); }
    if (a === 'dark') { S.dark = ev.target.checked; save(); render(); }
  });

  document.addEventListener('input', function (ev) {
    var fld = ev.target.dataset && ev.target.dataset.field;
    if (!fld) return;
    ui[fld] = ev.target.value;
    var sb = document.getElementById('f-submit');
    if (sb) sb.disabled = !ui.newTitle.trim();
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.id === 'w-garden') {
      var w = document.querySelector('[data-act="welcome"]'); if (w) w.click();
    }
  });

  // Sekundentakt nur für Countdown-Anzeigen, ohne Eingabefelder zu stören
  var lastState = lightState();
  setInterval(function () {
    var st = lightState();
    if (st !== lastState) { lastState = st; if (ui.tab === 'licht' || ui.tab === 'start') render(); return; }
    if (st === 'on') {
      var c = document.getElementById('count'); if (c) c.textContent = fmt(S.lightUntil - Date.now());
    }
    if (st === 'cooldown') {
      var k = document.getElementById('cool'); if (k) k.textContent = fmt(S.cooldownUntil - Date.now());
    }
    var tl = document.getElementById('tile-light'); if (tl) tl.textContent = lightTileText();
  }, 1000);

  render();

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
