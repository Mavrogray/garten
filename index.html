<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B3B">
<meta name="color-scheme" content="light">
<title>Jägerteich</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#2E6B3B; --accent-dark:#1E4A28; --accent-soft:#E3F0DE;
  --bg:#F6F4EC; --card:#FFFFFF; --line:#ECE8DB; --shadow:#E4E0D2;
  --text:#1F2A21; --text2:#3A4A3E; --muted:#56645A;
  --sun:#FFEDB8; --sun-ink:#3D2E00; --sky:#D7ECFB; --sky-ink:#0D3354; --sky-strong:#1F5E91;
  --peach:#FFE1C7; --peach-ink:#6E3005; --orange:#9A4A0C;
  --red-soft:#FBE3DF; --red-ink:#8A1F12;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;color:var(--text);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
input,textarea,select{font-family:inherit}
.app{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

header{position:relative;background:var(--accent);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 34px 22px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;min-height:44px}
.test-tag{background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;font-size:12px;letter-spacing:.04em}
.gear{margin-left:auto;width:46px;height:46px;border-radius:999px;border:none;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center}
.gear.on{background:#fff;color:var(--accent)}
.gear.hidden{visibility:hidden}
h1{margin:0;font-size:32px;font-weight:900;line-height:1.1}
.title-btn{all:unset;cursor:pointer;font:inherit;color:inherit;min-height:44px;display:inline-flex;align-items:center}
.title-btn:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:8px}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:22px;display:block}

main{flex:1 1 auto;overflow-y:auto;padding:8px 18px 24px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
section{display:flex;flex-direction:column;gap:16px}

.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 2px 0 var(--shadow);display:flex;flex-direction:column;gap:8px}
.card.green{background:var(--accent-soft);box-shadow:none}
.card.sunbg{background:var(--sun);box-shadow:none;color:var(--sun-ink)}
.chip{align-self:flex-start;background:var(--accent-soft);color:var(--accent-dark);font-size:14px;font-weight:800;padding:5px 12px;border-radius:999px}
.chip.white{background:#fff}
.chip.sun{background:#fff;color:var(--sun-ink)}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.big{font-size:24px;font-weight:900;line-height:1.2}
.h2{font-size:22px;font-weight:900}
.h3{font-size:18px;font-weight:900}
.sub{font-size:18px;color:var(--text2)}
.small{font-size:15px;color:var(--muted)}
.body{font-size:17px;color:var(--text2);line-height:1.45}
.center{text-align:center}
.sec-title{font-size:20px;font-weight:900;margin-top:4px}

.btn{min-height:48px;padding:0 20px;border-radius:999px;font-size:17px;font-weight:800;border:2px solid var(--accent);background:#fff;color:var(--accent)}
.btn.primary{border:none;background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-dark);min-height:56px;font-size:19px;font-weight:900}
.btn.primary:disabled{background:#A3ADA5;box-shadow:none}
.btn.ghost{border:2px solid #D5D9CC;color:var(--text2)}
.btn.soft{border:none;background:var(--accent-soft);color:var(--accent-dark);min-height:46px;font-size:16px}
.btn.white{border:none;background:#fff;color:var(--accent-dark);min-height:46px;font-size:16px}
.btn.danger{border:none;background:var(--red-soft);color:var(--red-ink);min-height:46px;font-size:16px}
.link{min-height:44px;border:none;background:transparent;color:var(--accent);font-size:17px;font-weight:800;padding:0 4px}
.back{align-self:flex-start;min-height:44px;border:none;background:transparent;color:var(--accent);font-size:17px;font-weight:800;padding:0}
.self-start{align-self:flex-start}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{min-height:132px;border-radius:26px;border:none;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:16px;text-align:left}
.tile.sun{background:var(--sun);color:var(--sun-ink)}
.tile.sky{background:var(--sky);color:var(--sky-ink)}
.tile .ico{width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center}
.tile .t1{font-size:19px;font-weight:900}
.tile .t2{font-size:15px;font-weight:700}

.mini{background:#fff;border-radius:22px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 2px 0 var(--shadow)}
.mini .col{display:flex;flex-direction:column;gap:2px;min-width:0}
.mini .tt{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.badge{flex-shrink:0;font-size:14px;font-weight:900;padding:6px 14px;border-radius:999px}
.badge.suche{background:var(--sky);color:var(--sky-ink)}
.badge.biete{background:var(--peach);color:var(--peach-ink)}

.seg{display:flex;gap:6px;background:var(--line);padding:5px;border-radius:999px}
.seg button{flex:1;min-height:46px;border-radius:999px;border:none;font-size:17px;font-weight:800;padding:0 10px;background:transparent;color:var(--text2)}
.seg button.on{color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);background:var(--accent)}
.seg button.on.alle{background:var(--text)}
.seg button.on.suche{background:var(--sky-strong)}
.seg button.on.biete{background:var(--orange)}

label.lbl{font-size:16px;font-weight:800;color:var(--text2)}
.field{width:100%;min-height:52px;border:2px solid #D5D9CC;border-radius:16px;padding:0 14px;font-size:18px;color:var(--text);background:#fff}
textarea.field{padding:12px 14px;resize:none;min-height:96px}
select.field{padding-right:8px}
.field:focus{outline:none;border-color:var(--accent)}
.field.sm{min-height:46px;font-size:17px;padding:0 10px}
.field.big-in{min-height:66px;font-size:30px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px;font-weight:800;color:var(--text2)}
.chk input{width:24px;height:24px;accent-color:var(--accent);flex-shrink:0}
.cons{font-size:17px;color:var(--text2);min-height:24px}
.warn{background:#FFF6DB;border:2px solid #E2C46A;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;color:#5A4307;font-size:16px}
.warn.red{background:var(--red-soft);border-color:#E9A79C;color:var(--red-ink)}
.cmp{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:2px solid var(--line)}
.cmp .ln{display:flex;justify-content:space-between;gap:10px;font-size:16px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 0;border:none;border-bottom:2px solid var(--line);background:transparent;text-align:left;font-size:16px;color:var(--text)}
.mrow .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}

.entry .title{font-size:21px;font-weight:900;line-height:1.2;word-break:break-word}
.entry .garden{font-size:16px;font-weight:700;color:var(--muted)}

.termin{flex-direction:row;gap:16px;align-items:flex-start}
.date{width:64px;flex-shrink:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0}
.date .wd{font-size:14px;font-weight:800;text-transform:uppercase}
.date .d{font-size:28px;font-weight:900;line-height:1}
.date .m{font-size:14px;font-weight:700}
.date.c0{background:var(--accent-soft);color:var(--accent-dark)}
.date.c1{background:var(--sky);color:var(--sky-ink)}
.date.c2{background:var(--peach);color:var(--peach-ink)}
.date.white{background:#fff;color:var(--accent-dark)}
.tcol{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}

.plan{display:flex;flex-direction:column}
.plan-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:2px solid var(--line);font-size:16px}
.plan-row.mine{font-weight:900;color:var(--accent-dark)}
.plan-row.past{color:#8C968E}

.demo{display:flex;flex-direction:column;gap:2px;background:#FFF6DB;border:2px dashed #C99A1E;border-radius:18px;padding:6px 16px;color:#5A4307}
.demo .ttl{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding-top:6px}
.demo label{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;font-size:16px;font-weight:700}
.demo input{width:24px;height:24px;accent-color:#8A6A10}

.on-card{background:#1E3524;color:#fff;border-radius:30px;padding:30px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.bulb{width:96px;height:96px;border-radius:999px;background:#FFE27A;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(255,226,122,.18)}
.count{font-size:52px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.on-card .btn{border-color:#fff;background:transparent;color:#fff;min-height:52px}
.sun-card{background:var(--sun);border-radius:30px;padding:22px;display:flex;flex-direction:column;gap:14px;color:var(--sun-ink)}
.minbtn{min-height:84px;border-radius:22px;border:none;background:#fff;color:var(--sun-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 #E2C46A}
.minbtn .n{font-size:30px;font-weight:900;line-height:1}
.minbtn .u{font-size:15px;font-weight:700}
.lock{width:52px;height:52px;border-radius:16px;background:var(--line);display:flex;align-items:center;justify-content:center}
.logrow{display:flex;justify-content:space-between;font-size:16px;color:var(--text2);border-bottom:2px solid var(--line);padding:8px 0}
.logrow b{font-weight:800}

.notice{background:var(--sky);border-radius:22px;padding:16px 18px;font-size:17px;color:var(--sky-ink);line-height:1.45}
.sensor{flex-direction:row;justify-content:space-between;align-items:center;gap:12px}
.temp{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--sky-strong);text-align:right}

.set-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:0 18px;border-radius:18px;border:none;background:var(--bg);color:var(--text);font-size:17px;font-weight:800;text-align:left}
.set-btn .cnt{background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px;font-size:14px}

.grp{display:grid;grid-template-columns:1fr 84px 20px 84px;gap:8px;align-items:center}
.grp span{font-size:16px;font-weight:700;color:var(--text2)}
.ga-edit{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--bg)}
.ga-edit.past{opacity:.7}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mini-lbl{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips button{flex-shrink:0;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid #D5D9CC;background:#fff;font-size:15px;font-weight:800;color:var(--text2)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}

.att-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.att-sum div{border-radius:16px;padding:10px;text-align:center;font-size:14px;font-weight:800}
.att-sum b{display:block;font-size:26px;font-weight:900}
.att-row{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:2px solid var(--line);font-size:18px;font-weight:800}
.att-row input{width:28px;height:28px;accent-color:var(--accent);flex-shrink:0}
.att-row .tag{margin-left:auto;font-size:13px;font-weight:900;padding:4px 10px;border-radius:999px}
.tag.exc{background:var(--sky);color:var(--sky-ink)}
.tag.add{background:var(--peach);color:var(--peach-ink)}

nav{flex-shrink:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:#fff;border-top:2px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom))}
nav button{min-height:58px;border:none;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:800;background:transparent;color:var(--muted)}
nav button.on{background:var(--accent-soft);color:var(--accent-dark)}
nav.hidden{display:none}

#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:12px 18px;border-radius:16px;font-size:16px;font-weight:700;max-width:calc(100% - 40px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 4 13c0-5 4-9 16-9 0 12-4 16-9 16z"/><path d="M4 21c3-5 6-8 10-10"/></svg>

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

    </div>
    <h1><button id="title" class="title-btn" data-act="tab" data-tab="start" aria-label="Zur Startseite">Moin!</button></h1>
    <svg class="wave" viewBox="0 0 390 22" preserveAspectRatio="none" aria-hidden="true"><path d="M0 22 C 60 2, 120 2, 195 12 S 330 24, 390 6 L 390 22 Z" fill="#F6F4EC"/></svg>
  </header>

  <main id="main" aria-live="polite"></main>

  <nav id="nav" aria-label="Hauptnavigation">
    <button data-act="tab" data-tab="start"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Start</span></button>
    <button data-act="tab" data-tab="boerse"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/></svg><span>Tausch</span></button>
    <button data-act="tab" data-tab="termine"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M3 10h18"/></svg><span>Termine</span></button>
    <button data-act="tab" data-tab="licht"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg><span>Licht</span></button>
    <button data-act="tab" data-tab="wetter"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg><span>Wetter</span></button>
  </nav>
</div>
<div id="toast" role="status"></div>

<script>

  var TERMINE = [

    { date: '2026-11-28', title: 'Adventsbasteln', time: '15:00 Uhr · Vereinsheim', text: 'Für Groß und Klein, mit Kaffee und Kuchen.' }
  ];

  var SENSORS = [

  function load() {

      var raw = localStorage.getItem(KEY);

  }

  function freshUi() {
    return { tab: 'start', filter: 'alle', form: false, newType: 'biete', newTitle: '', newText: '',
             admin: false, sview: '', attFor: '', excuseFor: '', excuseText: '', year: '', noteFor: '' };
  }

  var S = load();
  var ui = freshUi();

  S.entries = S.entries.filter(function (e) { return Date.now() - e.ts < EXPIRE_DAYS * DAY; });
  save();

  // ---------- Helfer ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(ms) { var s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + pad(s % 60); }
  function todayIso() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseIso(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dShort(s) { var d = parseIso(s); return WD[d.getDay()] + ', ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); }
  function dLong(s) { var d = parseIso(s); return WD_LONG[d.getDay()] + ', ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); }
  function daysUntil(s) { return Math.round((parseIso(s) - parseIso(todayIso())) / DAY); }
  function rel(ts) {
    var d0 = new Date(); d0.setHours(0, 0, 0, 0);
    if (ts >= d0.getTime()) return 'heute';
    var diff = Math.floor((d0.getTime() - ts) / DAY) + 1;
    if (diff <= 1) return 'gestern';
    if (diff < 7) return 'vor ' + diff + ' Tagen';
    if (diff < 14) return 'vor 1 Woche';
    return 'vor ' + Math.floor(diff / 7) + ' Wochen';
  }
  function clock(ts) {
    var d = new Date(ts);
    var day = rel(ts);
    if (day.indexOf('vor') === 0) day = WD[d.getDay()];
    return day + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function numList(str) {
    return String(str || '').split(/[^0-9]+/).filter(Boolean).map(Number).filter(function (n) { return n > 0 && n < 1000; });
  }
  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }
  function lightState() {
    var now = Date.now();
    if (now < S.lightUntil) return 'on';
    if (now < S.cooldownUntil) return 'cooldown';
    if (!S.inLan) return 'lan';
    if (!S.dark) return 'bright';
    return 'ready';
  }
  function footer() { return '<div class="small center">Testversion ' + APP_VERSION + ' · ' + COPYRIGHT + '</div>'; }

  // ---------- Gemeinschaftsarbeit ----------
  function groupById(id) { for (var i = 0; i < S.groups.length; i++) if (S.groups[i].id === id) return S.groups[i]; return null; }
  function groupLabel(id) { var g = groupById(id); return g ? 'Garten ' + g.from + '–' + g.to : 'ohne Gruppe'; }
  function gaById(id) { for (var i = 0; i < S.ga.length; i++) if (S.ga[i].id === id) return S.ga[i]; return null; }
  function gaSorted() { return S.ga.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }); }
  var NOTE_STATUS = {
    '': 'Kein Status',
    krank: 'Krank / verhindert',
    frei: 'Garten frei',
    befreit: 'Befreit (Vereinsaufgabe)',
    sonst: 'Sonstiges'
  };
  function yearOf(t) { return t.date.slice(0, 4); }
  function noteOf(year, n) { var y = S.notes[year]; return (y && y[n]) || null; }
  function excluded(year, n) { var x = noteOf(year, n); return !!(x && (x.status === 'frei' || x.status === 'befreit')); }
  // Gärten eines Termins: Gruppe + Zusätzlich − Ausgenommen − Verlegt − frei/befreit
  function gardensOf(t) {
    var g = groupById(t.group), list = [], mv = t.moved || {}, yr = yearOf(t);
    if (g) for (var i = g.from; i <= g.to; i++) list.push(i);
    (t.add || []).forEach(function (n) { if (list.indexOf(n) < 0) list.push(n); });
    list = list.filter(function (n) { return (t.skip || []).indexOf(n) < 0 && !mv[n] && !excluded(yr, n); });
    return list.sort(function (a, b) { return a - b; });
  }
  function countsFor(year) {
    var c = {};
    S.ga.forEach(function (t) {
      if (yearOf(t) !== year) return;
      (S.att[t.id] || []).forEach(function (n) { c[n] = (c[n] || 0) + 1; });
    });
    return c;
  }
  function noteNewlyDone(year, before) {
    var after = countsFor(year), hit = [];
    Object.keys(after).forEach(function (k) {
      if (after[k] >= 2 && (before[k] || 0) < 2) {
        var n = Number(k);
        hit.push(n);
        if (S.newDone.indexOf(n) < 0) S.newDone.push(n);
      }
    });
    if (hit.length === 1) toast('Garten ' + hit[0] + ' hat 2/2 erfüllt.');
    else if (hit.length > 1) toast(hit.length + ' Gärten haben 2/2 erfüllt.');
  }
  function gaYears() {
    var ys = {};
    S.ga.forEach(function (t) { ys[yearOf(t)] = 1; });
    return Object.keys(ys).sort();
  }
  function yearData(y) {
    var ts = S.ga.filter(function (t) { return yearOf(t) === y; });
    var all = {};
    S.groups.forEach(function (g) { for (var i = g.from; i <= g.to; i++) all[i] = 1; });
    ts.forEach(function (t) { (t.add || []).forEach(function (n) { all[n] = 1; }); });
    Object.keys(S.notes[y] || {}).forEach(function (n) { all[n] = 1; });
    var counts = countsFor(y);
    Object.keys(counts).forEach(function (n) { all[n] = 1; });
    var rows = Object.keys(all).map(Number).sort(function (a, b) { return a - b; }).map(function (n) {
      return { n: n, c: counts[n] || 0, note: noteOf(y, n), excl: excluded(y, n) };
    });
    var t0 = todayIso();
    var dates = ts.map(function (t) { return t.date; }).sort();
    var open = rows.filter(function (r) { return !r.excl && r.c < 2; });
    return {
      rows: rows,
      done: rows.filter(function (r) { return !r.excl && r.c >= 2; }),
      one: open.filter(function (r) { return r.c === 1; }),
      zero: open.filter(function (r) { return r.c === 0; }),
      open: open,
      excl: rows.filter(function (r) { return r.excl; }),
      sum: open.reduce(function (s, r) { return s + (2 - r.c) * FEE; }, 0),
      finished: dates.length > 0 && dates[dates.length - 1] < t0,
      last: dates[dates.length - 1] || ''
    };
  }
  function isAdded(t, n) { var g = groupById(t.group); return (t.add || []).indexOf(n) >= 0 && !(g && n >= g.from && n <= g.to); }
  function myGa() { var n = Number(S.garden); return gaSorted().filter(function (t) { return gardensOf(t).indexOf(n) >= 0; }); }
  function myNextGa() { var t0 = todayIso(); return myGa().filter(function (t) { return t.date >= t0; })[0] || null; }
  function excuseOf(tid, garden) {
    for (var i = 0; i < S.excuses.length; i++) if (S.excuses[i].terminId === tid && S.excuses[i].garden === String(garden)) return S.excuses[i];
    return null;
  }

  function downloadIcs(t) {
    var d = t.date.replace(/-/g, '');
    var stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    var lines = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//KGV Jaegerteich//Vereins-App//DE', 'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      'UID:ga-' + t.id + '-' + S.garden + '@jaegerteich',
      'DTSTAMP:' + stamp,
      'DTSTART;TZID=Europe/Berlin:' + d + 'T074500',
      'DTEND;TZID=Europe/Berlin:' + d + 'T120000',
      'SUMMARY:Gemeinschaftsarbeit KGV Jägerteich',
      'LOCATION:Vereinsheim KGV Jägerteich',
      'DESCRIPTION:Treffpunkt 7:45 Uhr am Vereinsheim\\, Arbeit 8–12 Uhr. Gartengeräte mitbringen.',
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Gemeinschaftsarbeit KGV Jägerteich', 'TRIGGER:-P' + S.remindDays + 'D', 'END:VALARM',
      'END:VEVENT', 'END:VCALENDAR'
    ];
    var blob = new Blob([lines.join('\r\n')], { type: 'text/calendar' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gemeinschaftsarbeit-' + t.date + '.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast('Kalenderdatei gespeichert, antippen zum Übernehmen.');
  }

  // ---------- Bausteine ----------
  function badge(e) { return '<span class="badge ' + e.type + '">' + (e.type === 'suche' ? 'Suche' : 'Biete') + '</span>'; }
  function gardenLabel(g) { return g === S.garden ? 'Dein Garten (' + esc(g) + ')' : 'Garten ' + esc(g); }

  function gaMemberCard(t, withPlanLink) {
    var ex = excuseOf(t.id, S.garden);

    var head = '<div class="between"><span class="chip ' + (soon ? 'sun' : 'white') + '">' + (soon ? when : 'Deine Gemeinschaftsarbeit') + '</span>' +

    }).join('');

    var vt = TERMINE.filter(function (x) { return x.date >= t0; }).map(function (t, i) {
      return '<div class="card termin">' + dateBox(t.date, 'c' + ((i + 1) % 3)) +
        '<div class="tcol"><span class="h3" style="font-size:20px;line-height:1.2">' + esc(t.title) + '</span>' +
        '<span class="small" style="font-weight:700">' + esc(t.time) + '</span>' +
        '<span class="body">' + esc(t.text) + '</span></div></div>';
    }).join('') || '<div class="small">Keine anstehenden Vereinstermine.</div>';

    var n = Number(S.garden);
    var plan = gaSorted().map(function (t) {
      var cls = gardensOf(t).indexOf(n) >= 0 ? ' mine' : '';
      if (t.date < t0) cls += ' past';
      return '<div class="plan-row' + cls + '"><span>' + dShort(t.date) + '</span><span>' + groupLabel(t.group) +
        ((t.add && t.add.length) ? ' +' + t.add.length : '') + '</span></div>';
    }).join('');

    return '<section>' +
      '<div class="sec-title">Deine Gemeinschaftsarbeit</div>' + mineHtml +
      '<div class="sec-title">Vereinstermine</div>' + vt +
      '<div class="sec-title">Plan Gemeinschaftsarbeit</div>' +
      '<div class="card"><div class="body">Jeder Garten ist <b>zwei Mal im Jahr</b> dran, samstags 8–12 Uhr. Nicht geleistete Arbeit kostet ' + FEE + ' € pro Einsatz.</div>' +
        '<div class="plan">' + plan + '</div></div>' +
      '<div class="small center">Beispielplan nach dem Muster der Vereinswebsite. Termine pflegt der Vorstand.</div>' +
    '</section>';
  }

  function viewLicht() {
    var st = lightState();
    var demo = '<div class="demo"><div class="ttl">Simulation (nur Test)</div>' +
      '<label><span>Handy ist im Vereins-WLAN</span><input type="checkbox" data-act="lan"' + (S.inLan ? ' checked' : '') + '></label>' +
      '<label><span>Draußen ist es dunkel</span><input type="checkbox" data-act="dark"' + (S.dark ? ' checked' : '') + '></label></div>';
    var main;
    if (st === 'on') {
      main = '<div class="on-card"><span class="bulb">' + ICON.bulb('#5A4300', 52) + '</span>' +
        '<div class="h2" style="margin-top:8px">Licht ist an</div>' +
        '<div class="count" id="count">' + fmt(S.lightUntil - Date.now()) + '</div>' +
        '<div style="font-size:16px;opacity:.85">geht von selbst wieder aus</div>' +
        '<button class="btn" data-act="stop">Jetzt ausschalten</button></div>';
    } else if (st === 'ready') {
      main = '<div class="sun-card"><div class="h2" style="font-size:23px">Licht anmachen</div>' +
        '<div class="body" style="color:inherit">Nach Ablauf der Zeit geht es automatisch wieder aus.</div>' +
        '<div class="tiles" style="gap:12px">' +
          '<button class="minbtn" data-act="light" data-min="5"><span class="n">5</span><span class="u">Minuten</span></button>' +
          '<button class="minbtn" data-act="light" data-min="10"><span class="n">10</span><span class="u">Minuten</span></button>' +
        '</div></div>';
    } else if (st === 'cooldown') {
      main = '<div class="card"><div class="h2">Kurze Pause</div>' +
        '<div class="body">Wieder möglich in <b id="cool" style="font-variant-numeric:tabular-nums">' + fmt(S.cooldownUntil - Date.now()) + '</b>. So bleibt das Licht nicht dauernd an.</div>' +
        '<button class="link self-start" data-act="skip">Pause überspringen (nur Test)</button></div>';
    } else if (st === 'lan') {
      main = '<div class="card"><span class="lock">' + ICON.lock + '</span><div class="h2">Nur vor Ort</div>' +
        '<div class="body">Das Licht lässt sich nur schalten, wenn dein Handy im WLAN der Anlage ist.</div></div>';
    } else {
      main = '<div class="card"><span class="lock">' + ICON.sun + '</span><div class="h2">Noch zu hell</div>' +
        '<div class="body">Das Wegelicht lässt sich erst ab der Dämmerung einschalten.</div></div>';
    }
    var log = S.log.slice(0, 5).map(function (l) {
      return '<div class="logrow"><b>' + (l.garden === S.garden ? 'Du' : 'Garten ' + esc(l.garden)) + '</b><span>' + clock(l.ts) + ' · ' + l.min + ' min</span></div>';
    }).join('');
    return '<section>' + demo + main +
      '<div style="display:flex;flex-direction:column;gap:6px"><div class="h3">Zuletzt geschaltet</div>' + (log || '<div class="small">Noch nichts.</div>') + '</div>' +
    '</section>';
  }

  function viewWetter() {
    return '<section>' +
      '<div class="notice"><b>Frostgefahr:</b> Am Teich waren es letzte Nacht 2,1 °C. Außenleitungen prüfen.</div>' +
      SENSORS.map(function (s) {
        return '<div class="card sensor"><div style="display:flex;flex-direction:column;gap:4px">' +
          '<span class="h3" style="font-size:19px">' + s.name + '</span>' +
          '<span class="small">Tiefst 24 h: ' + s.min + ' · ' + s.age + '</span></div>' +
          '<div><div class="temp">' + s.temp + '</div><div class="small" style="text-align:right">' + s.hum + '</div></div></div>';
      }).join('') +
      '<div class="small center">Beispielwerte. In der echten App melden die Sensoren alle 5 Minuten.</div>' +
    '</section>';
  }

  // ---------- Einstellungen & Admin ----------
  function viewSettings() {
    if (ui.sview && ui.admin) {
      if (ui.sview === 'plan') return viewPlan();
      if (ui.sview === 'att') return viewAtt();
      if (ui.sview === 'exc') return viewExc();
      if (ui.sview === 'year') return viewYear();
      if (ui.sview === 'meter') return viewMeter();
      if (ui.sview === 'mread') return viewReading();
      if (ui.sview === 'mround' && ui.rg) return viewRound();
    }
    var rd = S.remindDays;
    var admin;
    if (!ui.admin) {
      admin = '<div class="card"><div class="h2">Adminbereich</div>' +
        '<div class="body">Für den Vorstand: Gemeinschaftsarbeit planen, Anwesenheit abhaken, Entschuldigungen ansehen.</div>' +
        '<label class="lbl" for="a-pin">PIN</label>' +
        '<input class="field" id="a-pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••">' +
        '<div class="small">Test-PIN: 1234</div>' +
        '<button class="btn" data-act="admin-login">Entsperren</button></div>';
    } else {
      var openEx = S.excuses.length;
      admin = '<div class="card"><div class="between"><div class="h2">Adminbereich</div><span class="chip">entsperrt</span></div>' +
        '<button class="set-btn" data-act="sview" data-v="plan"><span>Gemeinschaftsarbeit planen</span><span>›</span></button>' +
        '<button class="set-btn" data-act="sview" data-v="att"><span>Anwesenheit abhaken</span><span>›</span></button>' +
        '<button class="set-btn" data-act="sview" data-v="exc"><span>Entschuldigungen</span><span>' + (openEx ? '<span class="cnt">' + openEx + '</span> ' : '') + '›</span></button>' +
        '<button class="set-btn" data-act="sview" data-v="year"><span>Jahresübersicht &amp; Abrechnung</span><span>' + (S.newDone.length ? '<span class="cnt">' + S.newDone.length + ' neu</span> ' : '') + '›</span></button>' +
        '<button class="set-btn" data-act="sview" data-v="meter"><span>Zählerstände Wasser &amp; Strom</span><span>›</span></button>' +
        '<button class="link self-start" data-act="admin-logout">Adminbereich sperren</button></div>';
    }
    return '<section>' +
      '<div class="card"><div class="h2">Mein Garten</div>' +
        '<div class="body">Angemeldet als <b>Garten ' + esc(S.garden) + '</b>.</div>' +
        '<button class="btn ghost self-start" data-act="change-garden">Garten ändern</button></div>' +
      '<div class="card"><div class="h2">Erinnerung</div>' +
        '<div class="body">Wie viele Tage vor der Gemeinschaftsarbeit soll die App erinnern?</div>' +
        '<div class="seg" role="group" aria-label="Erinnerung">' +
          [1, 3, 7].map(function (n) { return '<button class="' + (rd === n ? 'on' : '') + '" data-act="remind" data-d="' + n + '">' + n + (n === 1 ? ' Tag' : ' Tage') + '</button>'; }).join('') +
        '</div>' +
        '<div class="small">Die Startseite hebt den Termin dann gelb hervor. Mit „In Kalender“ erinnert zusätzlich dein Handy-Kalender. Push-Mitteilungen kommen mit der Server-Version.</div></div>' +
      admin +
      '<div class="card"><div class="h2">Über die App</div>' +
        '<div class="body">Testversion ' + APP_VERSION + '<br>' + COPYRIGHT + '</div>' +
        '<div class="small">Alle Daten liegen in dieser Testversion nur auf diesem Gerät.</div>' +
        '<button class="btn danger self-start" data-act="reset">Testdaten zurücksetzen</button></div>' +
    '</section>';
  }

  function backBtn() { return '<button class="back" data-act="sview" data-v="">‹ Einstellungen</button>'; }

  function groupOptions(sel) {
    return S.groups.map(function (g) { return '<option value="' + g.id + '"' + (g.id === sel ? ' selected' : '') + '>Garten ' + g.from + '–' + g.to + '</option>'; }).join('');
  }

  function termOptions(sel) {
    return gaSorted().map(function (t) {
      return '<option value="' + t.id + '"' + (t.id === sel ? ' selected' : '') + '>' + dShort(t.date) + ' · ' + groupLabel(t.group).replace('Garten ', '') + '</option>';
    }).join('');
  }
  function moveCard() {
    var moves = [];
    gaSorted().forEach(function (t) {
      var mv = t.moved || {};
      Object.keys(mv).forEach(function (n) {
        var to = gaById(mv[n]);
        moves.push('<div class="between plan-row"><span><b>Garten ' + n + '</b>: ' + dShort(t.date).slice(4, 10) + ' → ' + (to ? dShort(to.date).slice(4, 10) : '?') + '</span>' +
          '<button class="link" data-act="move-undo" data-from="' + t.id + '" data-n="' + n + '">Rückgängig</button></div>');
      });
    });
    return '<div class="card"><div class="h2">Garten verlegen</div>' +
      '<div class="small">Ein Garten macht an einem anderen Termin mit. Er erscheint dann dort und wird beim alten Termin nicht mehr als offen gezählt.</div>' +
      '<div><div class="mini-lbl">Garten</div><input class="field sm" id="m-garden" type="number" inputmode="numeric" placeholder="z. B. 33" aria-label="Gartennummer"></div>' +
      '<div class="two">' +
        '<div><div class="mini-lbl">Von</div><select class="field sm" id="m-from" aria-label="Von Termin">' + termOptions('') + '</select></div>' +
        '<div><div class="mini-lbl">Nach</div><select class="field sm" id="m-to" aria-label="Nach Termin">' + termOptions('') + '</select></div>' +
      '</div>' +
      '<button class="btn" data-act="ga-move">Verlegen</button>' +
      (moves.length ? '<div class="plan">' + moves.join('') + '</div>' : '') +
    '</div>';
  }

  function viewPlan() {
    var t0 = todayIso();
    var groups = S.groups.map(function (g, i) {
      return '<div class="grp"><span>Gruppe ' + (i + 1) + '</span>' +
        '<input class="field sm" type="number" inputmode="numeric" aria-label="Gruppe ' + (i + 1) + ' von" data-grp="' + g.id + '" data-k="from" value="' + g.from + '">' +
        '<span class="center">–</span>' +
        '<input class="field sm" type="number" inputmode="numeric" aria-label="Gruppe ' + (i + 1) + ' bis" data-grp="' + g.id + '" data-k="to" value="' + g.to + '"></div>';
    }).join('');
    var list = gaSorted().map(function (t) {
      return '<div class="ga-edit' + (t.date < t0 ? ' past' : '') + '">' +
        '<div class="two">' +
          '<div><div class="mini-lbl">Datum</div><input class="field sm" type="date" data-ga="' + t.id + '" data-k="date" value="' + t.date + '" aria-label="Datum"></div>' +
          '<div><div class="mini-lbl">Gruppe</div><select class="field sm" data-ga="' + t.id + '" data-k="group" aria-label="Gruppe">' + groupOptions(t.group) + '</select></div>' +
        '</div>' +
        '<div class="two">' +
          '<div><div class="mini-lbl">Zusätzlich</div><input class="field sm" type="text" inputmode="numeric" placeholder="z. B. 12, 50" data-ga="' + t.id + '" data-k="add" value="' + (t.add || []).join(', ') + '" aria-label="Zusätzliche Gärten"></div>' +
          '<div><div class="mini-lbl">Ausgenommen</div><input class="field sm" type="text" inputmode="numeric" placeholder="z. B. 33" data-ga="' + t.id + '" data-k="skip" value="' + (t.skip || []).join(', ') + '" aria-label="Ausgenommene Gärten"></div>' +
        '</div>' +
        '<div class="between"><span class="small">' + dShort(t.date) + ' · ' + gardensOf(t).length + ' Gärten</span>' +
        '<button class="btn danger" style="min-height:44px" data-act="ga-del" data-id="' + t.id + '">Löschen</button></div>' +
      '</div>';
    }).join('');
    return '<section>' + backBtn() +
      '<div class="card"><div class="h2">Neuer Termin</div>' +
        '<div class="two">' +
          '<div><div class="mini-lbl">Datum</div><input class="field sm" id="n-date" type="date" aria-label="Datum neuer Termin"></div>' +
          '<div><div class="mini-lbl">Gruppe</div><select class="field sm" id="n-group" aria-label="Gruppe neuer Termin">' + groupOptions(S.groups[0] && S.groups[0].id) + '</select></div>' +
        '</div>' +
        '<button class="btn primary" data-act="ga-add">Termin anlegen</button></div>' +
      moveCard() +
      '<div class="card"><div class="h2">Termine</div>' +
        '<div class="small">Änderungen werden sofort gespeichert. Verschieben: einfach das Datum ändern. Nachholer unter „Zusätzlich“ eintragen.</div>' +
        list + '</div>' +
      '<div class="card"><div class="h2">Gruppen</div><div class="small">Gartennummern von–bis, gelten für alle Termine.</div>' + groups + '</div>' +
    '</section>';
  }

  function viewAtt() {
    var sorted = gaSorted();
    if (!sorted.length) return '<section>' + backBtn() + '<div class="card"><div class="body">Noch keine Termine geplant.</div></div></section>';
    if (!ui.attFor || !gaById(ui.attFor)) {
      var t0 = todayIso(), pick = sorted[0];
      sorted.forEach(function (t) { if (t.date <= t0) pick = t; });
      if (pick.date > t0) pick = sorted[0];
      ui.attFor = pick.id;
    }
    var t = gaById(ui.attFor);
    var chips = '<div class="chips" role="group" aria-label="Termin wählen">' + sorted.map(function (x) {
      var d = parseIso(x.date);
      return '<button class="' + (x.id === t.id ? 'on' : '') + '" data-act="att-pick" data-id="' + x.id + '">' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.</button>';
    }).join('') + '</div>';
    var present = S.att[t.id] || [];
    var gardens = gardensOf(t);
    var nP = 0, nE = 0, nF = 0;
    var rows = gardens.map(function (n) {
      var here = present.indexOf(n) >= 0;
      var ex = excuseOf(t.id, n);
      if (here) nP++; else if (ex) nE++; else nF++;
      return '<label class="att-row"><input type="checkbox" data-att="' + n + '"' + (here ? ' checked' : '') + '><span>Garten ' + n + '</span>' +
        (ex ? '<span class="tag exc">entschuldigt</span>' : isAdded(t, n) ? '<span class="tag add">Nachholer</span>' : '') + '</label>';
    }).join('');
    var mv = t.moved || {};
    var movedRows = Object.keys(mv).map(function (n) {
      var to = gaById(mv[n]);
      return '<div class="att-row" style="color:var(--muted)"><span style="width:28px"></span><span>Garten ' + n + '</span>' +
        '<span class="tag" style="background:var(--line);color:var(--text2)">verlegt → ' + (to ? dShort(to.date).slice(4, 10) : '?') + '</span></div>';
    }).join('');
    return '<section>' + backBtn() + chips +
      '<div class="card"><div class="h2">' + dLong(t.date) + '</div><div class="small">' + groupLabel(t.group) + ' · ' + gardens.length + ' Gärten</div>' +
        '<div class="att-sum">' +
          '<div style="background:var(--accent-soft);color:var(--accent-dark)"><b>' + nP + '</b>da</div>' +
          '<div style="background:var(--sky);color:var(--sky-ink)"><b>' + nE + '</b>entschuldigt</div>' +
          '<div style="background:var(--red-soft);color:var(--red-ink)"><b>' + nF + '</b>offen</div>' +
        '</div>' +
        (t.date < todayIso() && nF ? '<div class="small">Bleiben ' + nF + ' Gärten offen, wären das ' + nF + ' × ' + FEE + ' € = ' + (nF * FEE) + ' €.</div>' : '') +
        '<div class="row"><button class="btn ghost" data-act="att-all">Alle da</button><button class="btn ghost" data-act="att-none">Alle leeren</button></div>' +
        rows + movedRows + '</div>' +
      '<div class="card"><div class="h3">Garten hinzufügen</div>' +
        '<div class="small">Für Gärten, die heute zusätzlich mitgemacht haben. Sie werden als anwesend eingetragen.</div>' +
        '<div class="row"><input class="field sm" id="att-add" type="number" inputmode="numeric" placeholder="Gartennummer" aria-label="Gartennummer hinzufügen" style="flex:1 1 120px">' +
        '<button class="btn" data-act="att-add" style="flex:0 0 auto">Hinzufügen</button></div></div>' +
    '</section>';
  }

  function pickYear() {
    var ys = gaYears();
    if (ui.year && ys.indexOf(ui.year) >= 0) return ui.year;
    var t0 = todayIso(), next = gaSorted().filter(function (t) { return t.date >= t0; })[0];
    ui.year = next ? yearOf(next) : (ys[ys.length - 1] || String(new Date().getFullYear()));
    return ui.year;
  }

  function noteLine(r) {
    if (!r.note) return '';
    var s = r.note.status ? NOTE_STATUS[r.note.status] : '';
    var txt = r.note.text ? esc(r.note.text) : '';
    return '<div class="small">' + [s, txt].filter(Boolean).join(' · ') + '</div>';
  }

  function noteEditor(y, n) {
    var x = noteOf(y, n) || { status: '', text: '' };
    var opts = Object.keys(NOTE_STATUS).map(function (k) { return '<option value="' + k + '"' + (x.status === k ? ' selected' : '') + '>' + NOTE_STATUS[k] + '</option>'; }).join('');
    return '<div class="ga-edit" style="margin-top:6px">' +
      '<div><div class="mini-lbl">Status</div><select class="field sm" id="nt-status" aria-label="Status">' + opts + '</select></div>' +
      '<div><div class="mini-lbl">Vermerk</div><input class="field sm" id="nt-text" type="text" maxlength="120" placeholder="z. B. Attest, nachgeholt am …" value="' + esc(x.text || '') + '" aria-label="Vermerk"></div>' +
      '<div class="small">„Garten frei“ und „Befreit“ nehmen den Garten in diesem Jahr aus Planung und Abrechnung.</div>' +
      '<div class="row"><button class="btn ghost" data-act="note-cancel">Abbrechen</button><button class="btn" data-act="note-save" data-n="' + n + '">Speichern</button></div>' +
    '</div>';
  }

  function yearRow(y, r, showFee) {
    var editing = ui.noteFor === String(r.n);
    var right = showFee ? '<b style="color:var(--red-ink)">' + ((2 - r.c) * FEE) + ' €</b>' : '';
    return '<div style="border-bottom:2px solid var(--line);padding:8px 0">' +
      '<div class="between"><span class="h3" style="font-size:17px">Garten ' + r.n + ' <span class="small" style="font-weight:700">· ' + r.c + '/2</span></span>' +
      '<span style="display:flex;align-items:center;gap:8px">' + right +
      '<button class="link" style="font-size:15px" data-act="note-open" data-n="' + r.n + '">Vermerk</button></span></div>' +
      noteLine(r) + (editing ? noteEditor(y, r.n) : '') + '</div>';
  }

  function viewYear() {
    var y = pickYear();
    var ys = gaYears();
    var d = yearData(y);
    var chips = ys.length > 1 ? '<div class="chips" role="group" aria-label="Jahr wählen">' + ys.map(function (x) {
      return '<button class="' + (x === y ? 'on' : '') + '" data-act="year-pick" data-y="' + x + '">' + x + '</button>';
    }).join('') + '</div>' : '';
    var news = S.newDone.length ? '<div class="card green"><span class="chip white">Neu erfüllt (2/2)</span>' +
      '<div class="body" style="color:var(--accent-dark)"><b>' + S.newDone.slice().sort(function (a, b) { return a - b; }).map(function (n) { return 'Garten ' + n; }).join(', ') + '</b></div>' +
      '<button class="btn white self-start" data-act="done-seen">Gesehen</button></div>' : '';
    var status = d.finished ? '<span class="chip red">Jahresabschluss</span>'
      : '<span class="chip">Zwischenstand' + (d.last ? ' · letzter Termin ' + dShort(d.last).slice(4, 10) : '') + '</span>';
    var doneChips = d.done.length ? '<div style="display:flex;flex-wrap:wrap;gap:6px">' + d.done.map(function (r) {
      return '<span class="badge" style="background:var(--accent-soft);color:var(--accent-dark)">' + r.n + '</span>';
    }).join('') + '</div>' : '<div class="small">Noch kein Garten mit zwei Einsätzen.</div>';
    var openList = d.open.map(function (r) { return yearRow(y, r, true); }).join('') || '<div class="small">Alle Gärten haben erfüllt.</div>';
    var exclList = d.excl.map(function (r) { return yearRow(y, r, false); }).join('');
    return '<section>' + backBtn() + chips + news +
      '<div class="card"><div class="between"><div class="h2">Gemeinschaftsarbeit ' + y + '</div></div>' + status +
        '<div class="att-sum" style="grid-template-columns:repeat(2,minmax(0,1fr))">' +
          '<div style="background:var(--accent-soft);color:var(--accent-dark)"><b>' + d.done.length + '</b>2/2 erfüllt</div>' +
          '<div style="background:var(--sun);color:var(--sun-ink)"><b>' + d.one.length + '</b>1× dabei</div>' +
          '<div style="background:var(--red-soft);color:var(--red-ink)"><b>' + d.zero.length + '</b>0× dabei</div>' +
          '<div style="background:var(--line);color:var(--text2)"><b>' + d.excl.length + '</b>frei / befreit</div>' +
        '</div>' +
        '<div class="body">Offener Betrag: <b>' + d.sum.toLocaleString('de-DE') + ' €</b> (' + FEE + ' € pro fehlendem Einsatz)' +
          (d.finished ? '' : '. Stand heute, es folgen noch Termine.') + '</div></div>' +
      '<div class="card"><div class="h2">An Kassenwart</div>' +
        '<label class="lbl" for="kw-mail">E-Mail Kassenwart</label>' +
        '<input class="field sm" id="kw-mail" type="email" data-set="treasurer" placeholder="kasse@…" value="' + esc(S.treasurer) + '">' +
        '<div class="row"><button class="btn primary" data-act="mail-kw">Per Mail senden</button></div>' +

      '<div class="card"><div class="h2">Erfüllt (2/2)</div>' + doneChips + '</div>' +
      '<div class="card"><div class="h2">Noch offen</div><div class="small">0× oder 1× dabei. Über „Vermerk“ den Grund eintragen oder den Garten als frei markieren.</div>' + openList + '</div>' +
      (exclList ? '<div class="card"><div class="h2">Frei / befreit</div>' + exclList + '</div>' : '') +
    '</section>';
  }

  function csvFor(y) {

      'Garten;Einsätze;Soll;Fehlend;Betrag €;Status;Vermerk'];
    d.rows.forEach(function (r) {
      var soll = r.excl ? 0 : 2, fehl = r.excl ? 0 : Math.max(0, 2 - r.c);
      var st = r.note && r.note.status ? NOTE_STATUS[r.note.status] : (fehl ? 'offen' : 'erfüllt');
      var tx = r.note && r.note.text ? String(r.note.text).replace(/[;\r\n]+/g, ' ') : '';

  function mailBody(y) {

      '2/2 erfüllt: ' + d.done.length + ' Gärten\n1× dabei: ' + d.one.length + ' Gärten\n0× dabei: ' + d.zero.length + ' Gärten\nfrei/befreit: ' + d.excl.length + ' Gärten\n\n' +

  }

  // ---------- Zählerstände ----------
  var MT = { w: { name: 'Wasser', unit: 'm³', hi: 3 }, s: { name: 'Strom', unit: 'kWh', hi: 150 } };
  var REASONS = { solar: 'Solar', speicher: 'Solar mit Speicher', other: 'Anderer Grund' };
  var REASONS_FOR = { s: ['solar', 'speicher', 'other'], w: ['other'] };

  function M() { if (!S.meters) S.meters = { readings: [], vals: {}, dist: [] }; return S.meters; }
  function parseNum(v) {
    if (v == null) return null;
    var s = String(v).replace(/\s/g, '');
    if (s === '') return null;
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    var n = Number(s);
    return isFinite(n) ? n : NaN;
  }
  function fmtN(n) { return (n == null || isNaN(n)) ? '–' : n.toLocaleString('de-DE', { maximumFractionDigits: 3 }); }
  function fmtSigned(n) { return (n > 0 ? '+' : n < 0 ? '−' : '±') + fmtN(Math.abs(n)); }
  function csvN(n) { return (n == null || isNaN(n)) ? '' : String(Math.round(n * 1000) / 1000).replace('.', ','); }
  function numDraft(n) { return n == null ? '' : String(n).replace('.', ','); }
  function parseRanges(str) {
    var out = [];
    String(str || '').split(/[,;\s]+/).forEach(function (p) {
      var m = p.match(/^(\d+)\s*[-–]\s*(\d+)$/);
      if (m) { var a = +m[1], b = +m[2]; if (a > b) { var t = a; a = b; b = t; } for (var i = a; i <= b && i - a < 500; i++) out.push(i); }
      else if (/^\d+$/.test(p)) out.push(+p);
    });
    return out.filter(function (n, i) { return n > 0 && out.indexOf(n) === i; }).sort(function (a, b) { return a - b; });
  }
  function rangesText(list) {
    var out = [], i = 0;
    while (i < list.length) {
      var j = i;
      while (j + 1 < list.length && list[j + 1] === list[j] + 1) j++;
      out.push(j > i ? list[i] + '–' + list[j] : String(list[i]));
      i = j + 1;
    }
    return out.join(', ');
  }
  function readingsSorted() {
    return M().readings.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.created - b.created; });
  }
  function readingById(id) { var r = M().readings; for (var i = 0; i < r.length; i++) if (r[i].id === id) return r[i]; return null; }
  function distById(id) { var d = M().dist; for (var i = 0; i < d.length; i++) if (d[i].id === id) return d[i]; return null; }
  function getV(rid, key) { var v = M().vals[rid]; return (v && v[key]) || null; }
  function prevOf(rid, key, k) {
    var list = readingsSorted(), idx = -1;
    for (var i = 0; i < list.length; i++) if (list[i].id === rid) idx = i;
    for (var j = idx - 1; j >= 0; j--) { var v = getV(list[j].id, key); if (v && typeof v[k] === 'number') return { val: v[k], r: list[j] }; }
    return null;
  }
  function consCalc(cur, prev, tausch) {
    if (cur == null || isNaN(cur) || !prev) return null;
    if (tausch && typeof tausch.alt === 'number' && typeof tausch.neu === 'number') return (tausch.alt - prev.val) + (cur - tausch.neu);
    return cur - prev.val;
  }
  function consOf(rid, key, k) {
    var v = getV(rid, key);
    if (!v || typeof v[k] !== 'number') return null;
    return consCalc(v[k], prevOf(rid, key, k), v[k + 'T']);
  }
  function meterGardens() {
    var all = {};
    S.groups.forEach(function (g) { for (var i = g.from; i <= g.to; i++) all[i] = 1; });
    var vals = M().vals;
    Object.keys(vals).forEach(function (rid) { Object.keys(vals[rid]).forEach(function (k) { if (/^g\d+$/.test(k)) all[k.slice(1)] = 1; }); });
    M().dist.forEach(function (d) { d.gardens.forEach(function (n) { all[n] = 1; }); });
    return Object.keys(all).map(Number).sort(function (a, b) { return a - b; });
  }
  function median(arr) {
    if (!arr.length) return null;
    var a = arr.slice().sort(function (x, y) { return x - y; }), m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }
  function highInfo(rid, n, k, cons) {
    if (cons == null || cons <= 0) return null;
    var hi = MT[k].hi, key = 'g' + n;
    var list = readingsSorted(), idx = -1, prevCons = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === rid) idx = i;
    for (var j = idx - 1; j >= 0; j--) { var c = consOf(list[j].id, key, k); if (c != null) { prevCons = c; break; } }
    if (prevCons != null && prevCons > 0 && cons > 2.5 * prevCons && cons - prevCons > hi) {
      return 'deutlich mehr als bei der letzten Ablesung (' + fmtN(prevCons) + ' ' + MT[k].unit + ')';
    }
    var others = meterGardens().filter(function (x) { return x !== n; }).map(function (x) { return consOf(rid, 'g' + x, k); }).filter(function (c) { return c != null && c > 0; });
    var med = others.length >= 5 ? median(others) : null;
    if (med != null && cons > 3 * med && cons - med > hi) {
      return 'mehr als das Dreifache des üblichen Verbrauchs (Mittel ' + fmtN(med) + ' ' + MT[k].unit + ')';
    }
    return null;
  }
  function gardenDone(rid, n) { var v = getV(rid, 'g' + n); return !!(v && typeof v.w === 'number' && typeof v.s === 'number'); }
  function hintParts(v, k) {
    var p = [];
    if (!v) return p;
    if (v[k + 'T']) p.push('Zählertausch: alt ' + fmtN(v[k + 'T'].alt) + ', neu ' + fmtN(v[k + 'T'].neu));
    if (v[k + 'R']) p.push(REASONS[v[k + 'R'].code] + (v[k + 'R'].text ? ': ' + v[k + 'R'].text : ''));
    if (v[k + 'Ok']) p.push('hoch, geprüft');
    return p;
  }
  function compareRows(rid) {
    var gs = meterGardens(), rows = [];
    ['w', 's'].forEach(function (k) {
      var vals = gs.map(function (n) { return consOf(rid, 'g' + n, k); }).filter(function (c) { return c != null; });
      rows.push({ label: 'Hauptzähler ' + MT[k].name, k: k, ref: consOf(rid, 'main', k),
        sum: vals.reduce(function (a, b) { return a + b; }, 0), n: vals.length, of: gs.length, main: true });
    });
    M().dist.forEach(function (d) {
      var vals = d.gardens.map(function (n) { return consOf(rid, 'g' + n, d.type); }).filter(function (c) { return c != null; });
      rows.push({ label: d.name, k: d.type, ref: consOf(rid, 'd' + d.id, 'v'),
        sum: vals.reduce(function (a, b) { return a + b; }, 0), n: vals.length, of: d.gardens.length, gardens: d.gardens });
    });
    return rows;
  }
  function seasonName(iso) { var d = parseIso(iso); return (d.getMonth() < 6 ? 'Frühjahr ' : 'Herbst ') + d.getFullYear(); }

  function shareOrDownload(data, name, title) {
    var file = null;
    try { file = new File([data], name, { type: 'text/csv' }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: title }).catch(function () {});
    } else {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: 'text/csv' }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      toast('Liste gespeichert: ' + name);
    }
  }

  function meterCsv(rid) {
    var r = readingById(rid), gs = meterGardens();
    var lines = ['Zählerstände ' + r.name + ' (' + dShort(r.date).slice(4) + ') – KGV Jägerteich',
      'Garten / Zähler;Wasser Stand;Wasser Verbrauch m³;Wasser Hinweis;Strom Stand;Strom Verbrauch kWh;Strom Hinweis'];
    gs.forEach(function (n) {
      var v = getV(rid, 'g' + n) || {};
      lines.push([n,
        csvN(v.w), csvN(consOf(rid, 'g' + n, 'w')), hintParts(v, 'w').join(' / ').replace(/;/g, ','),
        csvN(v.s), csvN(consOf(rid, 'g' + n, 's')), hintParts(v, 's').join(' / ').replace(/;/g, ',')].join(';'));
    });
    var mv = getV(rid, 'main') || {};
    lines.push('');
    lines.push(['Hauptzähler', csvN(mv.w), csvN(consOf(rid, 'main', 'w')), '', csvN(mv.s), csvN(consOf(rid, 'main', 's')), ''].join(';'));
    M().dist.forEach(function (d) {
      var dv = getV(rid, 'd' + d.id) || {}, c = consOf(rid, 'd' + d.id, 'v');
      var row = d.type === 'w' ? [d.name, csvN(dv.v), csvN(c), 'Gärten ' + rangesText(d.gardens), '', '', '']
                               : [d.name, '', '', '', csvN(dv.v), csvN(c), 'Gärten ' + rangesText(d.gardens)];
      lines.push(row.join(';'));
    });
    lines.push('');
    lines.push('Vergleich;Zähler;Summe Gärten;Differenz;Differenz %;Gärten erfasst');
    compareRows(rid).forEach(function (c) {
      var diff = c.ref != null ? c.ref - c.sum : null;
      lines.push([c.label + ' (' + MT[c.k].unit + ')', csvN(c.ref), csvN(c.sum), csvN(diff),
        (diff != null && c.ref) ? csvN(diff / c.ref * 100) : '', c.n + ' von ' + c.of].join(';'));
    });
    return '﻿' + lines.join('\r\n');
  }

  function meterMail(rid) {
    var r = readingById(rid), gs = meterGardens();
    var txt = 'Moin,\n\nhier die Zählerstände der Ablesung „' + r.name + '“ vom ' + dShort(r.date).slice(4) + '.\n\n';
    var cmp = compareRows(rid).map(function (c) {
      if (c.ref == null) return '- ' + c.label + ': Verbrauch ab der nächsten Ablesung';
      var diff = c.ref - c.sum;
      return '- ' + c.label + ': Zähler ' + fmtN(c.ref) + ' ' + MT[c.k].unit + ', Gärten ' + fmtN(c.sum) + ' ' + MT[c.k].unit +
        ' (' + c.n + '/' + c.of + '), Differenz ' + fmtSigned(diff) + (c.ref ? ' (' + fmtN(Math.round(diff / c.ref * 1000) / 10) + ' %)' : '');
    }).join('\n');
    txt += 'Vergleich:\n' + cmp + '\n\nGärten (Stand / Verbrauch):\n';
    var missing = [];
    gs.forEach(function (n) {
      var v = getV(rid, 'g' + n);
      if (!v || (typeof v.w !== 'number' && typeof v.s !== 'number')) { missing.push(n); return; }
      var part = function (k) {
        if (typeof v[k] !== 'number') return MT[k].name.charAt(0) + ' –';
        var c = consOf(rid, 'g' + n, k);
        return MT[k].name.charAt(0) + ' ' + fmtN(v[k]) + (c != null ? ' (' + fmtSigned(c) + ' ' + MT[k].unit + ')' : '');
      };
      var h = hintParts(v, 'w').concat(hintParts(v, 's'));
      txt += 'G' + n + ': ' + part('w') + ' | ' + part('s') + (h.length ? ' [' + h.join('; ') + ']' : '') + '\n';
    });
    if (missing.length) txt += '\nNicht erfasst: ' + rangesText(missing) + '\n';
    return txt + '\nDie vollständige Liste hängt als CSV an bzw. lässt sich aus der App teilen.\n\nGesendet aus der Vereins-App (Testversion ' + APP_VERSION + ')';
  }

        '<div class="small">' + (p ? 'zuletzt ' + fmtN(p.val) : 'Startwert') + '</div></div>';

      return '<div><div class="mini-lbl">' + esc(d.name) + ' (' + MT[d.type].unit + ')</div><input class="field sm" inputmode="decimal" data-mv="d' + d.id + '" data-k="v" value="' + numDraft(dv.v) + '" aria-label="' + esc(d.name) + '">' +

      [['alle', 'Alle'], ['offen', 'Offen'], ['hinweis', 'Hinweise']].map(function (x) { return '<button class="' + (f === x[0] ? 'on' : '') + '" data-act="mfilter" data-f="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';
    return '<section><button class="back" data-act="sview" data-v="meter">‹ Zähler</button>' +

        '<div class="body" style="color:var(--accent-dark)"><b>' + done + ' von ' + gs.length + '</b> Gärten komplett erfasst, noch ' + (gs.length - done) + ' offen.</div>' +
        '<button class="btn primary" data-act="rg-start">' + (done ? 'Rundgang fortsetzen' : 'Rundgang starten') + '</button></div>' +
      '<div class="card"><div class="h2">Hauptzähler &amp; Verteiler</div><div class="two">' + mainIn + '</div>' +
        (distIn ? '<div class="two">' + distIn + '</div>' : '<div class="small">Noch keine Verteiler angelegt (unter „Zähler“).</div>') + '</div>' +
      '<div class="card"><div class="h2">Vergleich</div>' + compareRows(r.id).map(cmpHtml).join('') + '</div>' +
      '<div class="card"><div class="h2">An Kassenwart</div>' +
        '<label class="lbl" for="kw-mail2">E-Mail Kassenwart</label>' +
        '<input class="field sm" id="kw-mail2" type="email" data-set="treasurer" placeholder="kasse@…" value="' + esc(S.treasurer) + '">' +
        '<button class="btn primary" data-act="meter-mail">Per Mail senden</button>' +
